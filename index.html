<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gerbang CARE · Appreciate · Lihat Usahanya!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#1E5BC6;--blue2:#2463C8;--navy:#1F3C82;--red:#E5322D;--redD:#B8231F;--yellow:#FFC928;--ink:#2B2D42;--muted:#6B7185;--green:#22B573;
  --spring:cubic-bezier(.34,1.56,.64,1);--smooth:cubic-bezier(.22,1,.36,1);--f:'Quicksand','Nunito',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0;overflow:hidden;background:#16428c}
body{font-family:var(--f);font-weight:600;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
button{font-family:inherit;border:0;cursor:pointer;color:inherit;background:none;-webkit-tap-highlight-color:transparent}
input{font-family:inherit;-webkit-user-select:text;user-select:text}

/* ---------- Frame (tinggi tetap 600px untuk LMS) ---------- */
#app{position:relative;width:100%;height:600px;overflow:hidden;
  background:radial-gradient(120% 80% at 10% 0%,#2f78dd 0%,transparent 55%),radial-gradient(90% 70% at 100% 100%,rgba(229,50,45,.35) 0%,transparent 60%),#16428c}
#app::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 2px,transparent 2.5px);background-size:28px 28px}
#stage{position:absolute;left:50%;top:50%;width:720px;height:1280px;overflow:hidden;background:#fff;transform:translate(-50%,-50%);transform-origin:50% 50%}
#stage.framed{border-radius:30px;box-shadow:0 30px 90px rgba(0,0,0,.4)}
#scene{position:absolute;inset:0;z-index:1;overflow:hidden}
.bg{position:absolute;inset:0}
.bg svg{width:100%;height:100%;display:block}
#fx{position:absolute;inset:0;z-index:20;pointer-events:none}
#fxc{position:absolute;left:0;top:0;width:720px;height:1280px}
#vig{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse 78% 62% at 50% 50%,rgba(229,50,45,0) 36%,rgba(229,50,45,.45) 66%,rgba(185,18,18,.92) 100%)}
#ui{position:absolute;inset:0;z-index:40;pointer-events:none}
#ui .backdrop,#ui .panel,#ui .choices,#ui .start,#ui .holdBtn,#ui .guide,#ui .autoBtn,#ui .nextBtn,#ui .cheer,#ui .again{pointer-events:auto}
#wipe{position:absolute;inset:0;z-index:70;pointer-events:none}
#wipe.on{pointer-events:auto}
#wipe i{position:absolute;left:50%;top:50%;width:1600px;height:1600px;margin:-800px 0 0 -800px;border-radius:50%;transform:scale(0)}
#wipe .w1{background:var(--red)}#wipe .w2{background:var(--blue)}
#copy{position:absolute;left:0;right:0;bottom:12px;text-align:center;z-index:66;pointer-events:none}
#copy span{display:inline-block;font:600 17px var(--f);color:rgba(255,255,255,.95);background:rgba(20,32,70,.45);padding:5px 16px;border-radius:999px;letter-spacing:.3px}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;height:112px;z-index:30;display:flex;align-items:center;padding:18px 124px 14px 20px;pointer-events:none;transition:transform .6s var(--smooth),opacity .5s}
#hud.hide{transform:translateY(-130%);opacity:0}
.mchip{display:flex;align-items:center;gap:14px;background:#fff;border-radius:24px;height:78px;padding:0 26px 0 13px;box-shadow:0 6px 0 rgba(0,0,0,.1);max-width:100%;min-width:0}
.mchip b{flex:none;width:52px;height:52px;border-radius:16px;background:var(--red);color:#fff;display:grid;place-items:center;font:700 28px var(--f)}
.mchip div{min-width:0}
.mchip small{display:block;font:700 15px var(--f);color:#9aa0b2;letter-spacing:1.5px}
.mchip span{display:block;font:700 27px var(--f);color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bgmBtn{position:absolute;right:20px;top:18px;z-index:68;width:86px;height:78px;border-radius:22px;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.12);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .15s,box-shadow .15s}
#bgmBtn:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
#bgmBtn svg{width:40px;height:34px}
#bgmBtn span{font:700 14px var(--f);letter-spacing:1px;color:var(--blue)}
#bgmBtn.off span{color:#9aa0b2}
#bgmBtn .eq rect{transform-box:fill-box;transform-origin:50% 100%;animation:eq .8s ease-in-out infinite alternate}
#bgmBtn .eq rect:nth-child(2){animation-delay:.25s}#bgmBtn .eq rect:nth-child(3){animation-delay:.5s}
@keyframes eq{0%{transform:scaleY(.3)}100%{transform:scaleY(1)}}
#bgmBtn.off .eq{display:none}#bgmBtn .x{display:none}#bgmBtn.off .x{display:inline}

/* ---------- Characters ---------- */
.chr{position:absolute;pointer-events:none;will-change:transform}
.chr svg{display:block;width:100%;height:auto;overflow:visible;transform-origin:50% 100%;transition:filter .5s}
.chr .upper{animation:breathe 3.6s ease-in-out infinite;animation-delay:var(--bd,0s)}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(2.4px)}}
.chr .head,.chr .headBack{transform-box:view-box;transform-origin:100px 150px;animation:tilt 6s ease-in-out infinite;animation-delay:var(--bd,0s)}
@keyframes tilt{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.8deg)}}
.chr .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite;animation-delay:var(--bd,0s)}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
.chr .feat{transform:translateX(var(--look,0px));transition:transform .45s var(--smooth)}
.chr .arm{transform-box:view-box;transition:transform .6s var(--spring)}
.chr.live .arm{transition:none}
.chr.talking .mouth{transform-box:fill-box;transform-origin:center;animation:talk .15s ease-in-out infinite alternate}
@keyframes talk{to{transform:scaleY(.3) scaleX(1.08)}}
.chr .sweat{transform-box:fill-box;animation:drip 1.5s ease-in infinite}
.chr .sweat.s2{animation-delay:.7s}
@keyframes drip{0%{transform:translateY(-4px);opacity:0}20%{opacity:1}100%{transform:translateY(18px);opacity:0}}
.chr.dim svg{filter:brightness(.8) saturate(.85)}
.prop{display:none}
.p-bag .prop-bag,.p-stack .prop-stack,.p-leaflet .prop-leaflet,.p-leafR .prop-leafR,.p-scanner .prop-scanner,.p-rag .prop-rag,.p-broom .prop-broom{display:inline}
.p-give .armL{transform:rotate(72deg)}
.p-take .armR{transform:rotate(-68deg)}
.p-hips .armL{transform:rotate(28deg)}.p-hips .armR{transform:rotate(-28deg)}
.p-five .armR{transform:rotate(-150deg)}
.p-fiveL .armL{transform:rotate(150deg)}
.p-wave .armR{transform:rotate(-150deg);animation:wave 1s ease-in-out .6s infinite}
@keyframes wave{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(-178deg)}}
.p-cheer .armR{transform:rotate(-165deg);animation:pump .5s ease-in-out .6s infinite alternate}
@keyframes pump{from{transform:rotate(-165deg)}to{transform:rotate(-148deg)}}
.p-scratch .armR{transform:rotate(185deg);animation:scratch .28s ease-in-out .65s infinite alternate}
@keyframes scratch{from{transform:rotate(185deg)}to{transform:rotate(197deg)}}

/* ---------- Dialog ---------- */
.dlg{position:absolute;left:34px;right:34px;bottom:76px;min-height:232px;background:#fff;border-radius:36px;padding:56px 40px 46px;
  box-shadow:0 10px 0 rgba(0,0,0,.07),0 24px 54px rgba(20,30,70,.2);z-index:10;pointer-events:none}
.dlg .who{position:absolute;top:-28px;left:28px;display:flex;align-items:center;gap:10px;background:var(--c,#1E5BC6);color:#fff;padding:6px 20px 6px 6px;border-radius:999px;
  font:700 26px var(--f);box-shadow:0 5px 0 rgba(0,0,0,.12);white-space:nowrap;max-width:calc(100% - 40px)}
.dlg .who .av{width:46px;height:46px;border-radius:50%;background:#fff;overflow:hidden;flex:none}
.dlg .who .av svg{width:100%;height:100%;display:block}
.dlg .who em{font-style:normal;font:700 14px var(--f);letter-spacing:.8px;background:rgba(255,255,255,.22);padding:4px 10px;border-radius:999px}
.dlg .txt{font:600 32px/1.45 var(--f);color:var(--ink)}
.hl{color:var(--red);font-weight:700}
.dlg.narr{background:#EAF1FF;padding:46px 44px 46px}
.dlg.narr .who{display:none}
.dlg.narr .txt{color:#2E4170;text-align:center}
.dlg .next{position:absolute;right:30px;bottom:22px;width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:15px solid #B8BED0;opacity:0;transition:opacity .25s}
.dlg .next.show{opacity:1;animation:nudge .8s ease-in-out infinite alternate}
@keyframes nudge{to{transform:translateY(5px)}}
.ch{opacity:0;transition:opacity .12s}.ch.on{opacity:1}

/* ---------- Panels / buttons ---------- */
.backdrop{position:absolute;inset:0;background:rgba(18,28,64,.6)}
.pwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:124px 36px 84px;pointer-events:none}
.panel{width:100%;max-height:100%;overflow:auto;background:#fff;border-radius:38px;padding:42px 40px 40px;text-align:center;
  box-shadow:0 14px 0 rgba(0,0,0,.1),0 30px 80px rgba(0,0,0,.3)}
.panel h2{font:700 44px/1.18 var(--f);color:var(--navy);margin:16px 0 10px}
.panel .sub{font:600 27px/1.45 var(--f);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:8px;background:#FFEDEC;color:var(--red);font:700 21px var(--f);letter-spacing:1.5px;padding:8px 20px;border-radius:999px}
.chip.blue{background:#EAF1FF;color:var(--blue)}
.chip.green{background:#E3F7EC;color:#138A57}
.mIcon{width:230px;height:170px;margin:20px auto 0;border-radius:40px;background:#EAF1FF;display:grid;place-items:center}
.mIcon svg{width:200px;height:160px}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:96px;border-radius:30px;background:var(--red);color:#fff;
  font:700 34px var(--f);box-shadow:0 9px 0 var(--redD);transition:transform .12s,box-shadow .12s,filter .2s,opacity .2s;margin-top:30px}
.btn:active{transform:translateY(7px);box-shadow:0 2px 0 var(--redD)}
.btn.blue{background:var(--blue);box-shadow:0 9px 0 #133f8f}
.btn.blue:active{box-shadow:0 2px 0 #133f8f}
.btn.green{background:var(--green);box-shadow:0 9px 0 #158450}
.btn[disabled]{filter:grayscale(1);opacity:.45;pointer-events:none}
.btn svg{width:36px;height:36px}
.illus{position:relative;height:300px;margin:22px 0 4px;border-radius:28px;overflow:hidden}
.mini{position:absolute;inset:0;overflow:hidden}
.mini .chr{position:absolute}
.mplan{background:#D9A877}
.paperS{position:absolute;left:50%;top:50%;width:640px;height:460px;transform:translate(-50%,-50%) scale(var(--ps,.38));box-shadow:0 10px 20px rgba(0,0,0,.18)}

/* Choices */
.choices{position:absolute;left:34px;right:34px;bottom:84px}
.cTitle{background:#fff;border-radius:30px;padding:24px 28px 26px;text-align:center;font:700 33px/1.3 var(--f);color:var(--navy);box-shadow:0 8px 0 rgba(0,0,0,.08);margin-bottom:22px}
.cTitle small{display:block;font:600 24px/1.35 var(--f);color:var(--muted);margin-top:6px}
.choice{display:flex;align-items:center;gap:20px;width:100%;text-align:left;background:#fff;border-radius:28px;padding:22px 24px;margin-bottom:18px;
  font:600 28px/1.4 var(--f);color:var(--ink);box-shadow:0 8px 0 #D3D9E4,0 16px 34px rgba(0,0,0,.14);transition:transform .14s,box-shadow .14s,opacity .3s}
.choice:active{transform:translateY(6px);box-shadow:0 2px 0 #D3D9E4}
.choice .cL{flex:none;width:58px;height:58px;border-radius:18px;background:#EEF2FA;display:grid;place-items:center;font:700 28px var(--f);color:var(--blue)}
.choice.used{opacity:.4;pointer-events:none}
.choice.used .cT{text-decoration:line-through}

/* Small UI */
.instr{position:absolute;left:50%;top:126px;transform:translateX(-50%);background:var(--ink);color:#fff;font:700 25px var(--f);padding:11px 28px 11px 12px;border-radius:999px;
  white-space:nowrap;display:flex;align-items:center;gap:12px;box-shadow:0 6px 0 rgba(0,0,0,.18);z-index:9}
.instr i{width:40px;height:40px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;flex:none}
.instr i svg{width:26px;height:26px}
.instr.ok{background:var(--green)}
.instr.ok i{background:#fff}
.toast{position:absolute;left:50%;top:222px;transform:translateX(-50%);background:var(--ink);color:#fff;font:700 24px var(--f);padding:12px 26px;border-radius:999px;white-space:nowrap;z-index:9}
.banner{position:absolute;left:50%;top:380px;transform:translate(-50%,-50%);background:var(--yellow);color:var(--ink);font:700 40px/1.2 var(--f);padding:24px 42px;border-radius:28px;
  box-shadow:0 10px 0 rgba(0,0,0,.12);text-align:center;width:max-content;max-width:640px;z-index:9}

/* ---------- Start ---------- */
.start{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#FFF8E6 0%,#FFEFC2 100%);z-index:5}
.start::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(229,50,45,.09) 3px,transparent 3.6px);background-size:38px 38px}
.start .stripes{position:absolute;left:0;right:0;top:0;height:30px;background:linear-gradient(#E5322D 0 34%,#1E5BC6 34% 67%,#FFC928 67%)}
.start .rays{position:absolute;left:50%;top:640px;width:1800px;height:1800px;margin:-900px;background:repeating-conic-gradient(rgba(255,201,40,.22) 0 10deg,transparent 10deg 20deg);animation:spin 70s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sTitle{position:absolute;left:40px;right:40px;top:104px;text-align:center;color:var(--navy)}
.chipM{display:inline-flex;align-items:center;gap:10px;background:var(--red);color:#fff;font:700 23px var(--f);letter-spacing:1.5px;padding:10px 24px;border-radius:999px;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.sTitle h1{font:700 86px/1.02 var(--f);margin-top:22px;text-shadow:0 6px 0 rgba(255,201,40,.45)}
.sTitle h1 span{color:var(--red)}
.sTitle p{font:600 29px/1.4 var(--f);color:#7A6430;margin-top:14px}
.sChars{position:absolute;left:0;right:0;top:470px;height:520px}
.sCard{position:absolute;left:36px;right:36px;bottom:72px;background:#fff;border-radius:40px;padding:36px 36px 34px;box-shadow:0 14px 0 rgba(0,0,0,.15),0 30px 70px rgba(0,0,0,.3);z-index:3;text-align:center}
.sCard .btn{margin-top:0}
.sCard label{display:block;font:700 32px var(--f);color:var(--navy);margin-bottom:6px}
.sCard .hint{font:600 23px var(--f);color:#8a90a2;margin-bottom:18px}
.sCard input{width:100%;height:max(92px,calc(var(--minFs,32px) * 2.6));border:4px solid #DDE2EC;border-radius:26px;padding:0 26px;font:700 max(32px,var(--minFs,32px)) var(--f);color:var(--ink);background:#F7F9FC;outline:none;transition:border-color .2s;text-align:center;margin-bottom:28px}
.sCard input:focus{border-color:var(--blue);background:#fff}
.sCard.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-12px)}50%{transform:translateX(10px)}75%{transform:translateX(-5px)}}
.snd{display:flex;align-items:center;justify-content:center;gap:10px;font:600 20px var(--f);color:#a0a6b5;margin-top:20px}
.snd svg{width:28px;height:28px}
.gRow{display:flex;gap:22px;margin:4px 0 30px}
.gopt{flex:1;position:relative;background:#F3F6FC;border-radius:30px;padding:14px 10px 16px;display:flex;flex-direction:column;align-items:center;box-shadow:0 6px 0 #DCE2EE;transition:transform .4s var(--spring),background .25s,box-shadow .25s}
.gopt .gav{width:190px;height:262px}
.gopt .gav svg{width:100%;height:100%;display:block}
.gopt b{font:700 32px var(--f);color:var(--navy);margin-top:4px}
.gopt.sel{background:#FFF6D6;box-shadow:0 0 0 5px var(--yellow),0 10px 0 #E9B800;transform:translateY(-6px)}
.gchk{position:absolute;right:-10px;top:-10px;width:50px;height:50px;border-radius:50%;background:var(--green);display:grid;place-items:center;transform:scale(0);transition:transform .4s var(--spring)}
.gchk svg{width:30px;height:30px}
.gopt.sel .gchk{transform:scale(1)}

/* ---------- Misi 1 ---------- */
.hideBox{position:absolute;left:380px;top:300px;width:340px;height:712px;overflow:hidden;z-index:6}
.hideBox .chr{transform-origin:50% 96%}
.planter{position:absolute;left:410px;top:640px;width:310px;height:380px;z-index:7}
.planter svg{width:100%;height:100%;display:block}
.alert{position:absolute;width:78px;height:78px;margin-left:-39px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font:700 54px/1 var(--f);
  box-shadow:0 6px 0 var(--redD),0 0 0 10px rgba(229,50,45,.2);transform:scale(0);transition:transform .35s var(--spring);z-index:8}
.alert.on{transform:scale(1);animation:wob .22s ease-in-out .35s infinite alternate}
@keyframes wob{from{transform:scale(1) rotate(-9deg)}to{transform:scale(1.07) rotate(9deg)}}
.sbub{position:absolute;background:#fff;border-radius:24px;padding:14px 24px;font:600 26px/1.3 var(--f);color:var(--ink);white-space:nowrap;
  box-shadow:0 6px 0 rgba(0,0,0,.07),0 14px 30px rgba(20,30,70,.15);transform:scale(.3);opacity:0;transform-origin:var(--tx,50%) 130%;transition:transform .35s var(--spring),opacity .2s;z-index:8}
.sbub::after{content:'';position:absolute;left:var(--tx,50%);bottom:-11px;width:24px;height:24px;margin-left:-12px;background:#fff;transform:rotate(45deg);border-radius:4px}
.sbub.on{transform:none;opacity:1}
.game{position:absolute;inset:0;pointer-events:none}
.prow{position:absolute;left:20px;right:20px;top:124px;display:flex;gap:14px}
.pcard{flex:1;background:#fff;border-radius:24px;padding:12px 22px 16px;box-shadow:0 6px 0 rgba(0,0,0,.1)}
.ptop{display:flex;justify-content:space-between;align-items:center;font:700 22px var(--f);color:var(--muted)}
.ptop b{font:700 26px var(--f);color:var(--blue)}
.ptrack{height:22px;border-radius:12px;background:#EEF1F6;overflow:hidden;margin-top:8px;position:relative}
.pfill{position:absolute;inset:0;border-radius:12px;background:linear-gradient(90deg,#FFC928,#FF8A2B);transform-origin:left;transform:scaleX(0)}
.hearts{flex:none;display:flex;align-items:center;gap:6px;background:#fff;border-radius:24px;padding:0 18px;box-shadow:0 6px 0 rgba(0,0,0,.1)}
.hearts svg{width:40px;height:40px;transition:transform .4s var(--spring),filter .4s,opacity .4s}
.hearts svg.lost{filter:grayscale(1);opacity:.35;transform:scale(.72)}
.holdBtn{position:absolute;left:50%;top:1112px;width:196px;height:196px;margin:-98px 0 0 -98px;border-radius:50%;background:var(--yellow);
  box-shadow:0 10px 0 #D9A200,0 22px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font:700 27px var(--f);color:var(--ink);touch-action:none;transition:transform .12s,box-shadow .12s,background .2s}
.holdBtn svg{width:84px;height:56px}
.holdBtn small{font:600 17px var(--f);color:#6a5200}
.holdBtn.on{transform:translateY(8px);box-shadow:0 2px 0 #D9A200,0 10px 20px rgba(0,0,0,.2);background:#86E0A3}
.holdBtn.on small{color:#1d6b3b}
.holdBtn::before{content:'';position:absolute;inset:-14px;border-radius:50%;border:4px solid rgba(255,255,255,.75);animation:ring 1.6s ease-out infinite}
.holdBtn.on::before{display:none}
@keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.25);opacity:0}}
.guide{position:absolute;inset:0;background:radial-gradient(circle 250px at 300px 610px,rgba(12,18,44,0) 205px,rgba(12,18,44,.74) 250px)}
.gcard{position:absolute;left:50px;right:50px;bottom:92px;background:#fff;border-radius:34px;padding:58px 36px 32px;text-align:center;box-shadow:0 12px 0 rgba(0,0,0,.12),0 30px 60px rgba(0,0,0,.3)}
.gcard .gi{position:absolute;left:50%;top:-40px;width:80px;height:80px;margin-left:-40px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font:700 52px var(--f);box-shadow:0 0 0 9px #fff}
.gcard b{display:block;font:700 36px var(--f);color:var(--navy)}
.gcard p{font:600 26px var(--f);color:var(--muted);margin-top:6px}
.gcard .btn{margin-top:24px;height:88px}

/* ---------- Laci ---------- */
.register{position:absolute;left:46px;top:506px;width:210px;height:168px;z-index:5}
.register svg{width:100%;height:100%;display:block}
.counter{position:absolute;left:-10px;right:-10px;top:650px;height:380px;z-index:4}
.ctop{position:absolute;left:0;right:0;top:0;height:54px;background:linear-gradient(#FBFCFD,#D6DCE3);border-radius:10px 10px 0 0;box-shadow:0 8px 0 rgba(0,0,0,.06)}
.cbody{position:absolute;left:20px;right:20px;top:54px;bottom:0;background:#F2EADD}
.cstripe{position:absolute;left:0;right:0;bottom:46px;height:30px;background:linear-gradient(#E5322D 0 34%,#1E5BC6 34% 67%,#FFC928 67%)}
.drawer{position:absolute;left:230px;top:110px;width:280px;height:110px;cursor:pointer}
.din{position:absolute;left:10px;right:10px;top:0;height:0;background:#6B5644;border-radius:10px 10px 0 0;overflow:hidden}
.dfront{position:absolute;left:0;right:0;top:0;height:110px;background:#E3D4BE;border-radius:16px;box-shadow:0 6px 0 rgba(0,0,0,.08)}
.handle{position:absolute;left:50%;top:44px;width:120px;height:20px;margin-left:-60px;border-radius:10px;background:#9AA3AF}
.dring{position:absolute;inset:-18px;border-radius:28px;border:5px dashed #fff;box-shadow:0 0 0 6px rgba(229,50,45,.45),0 0 30px rgba(229,50,45,.35);animation:gpulse 1.1s ease-in-out infinite;pointer-events:none}
@keyframes gpulse{0%,100%{scale:1}50%{scale:1.05}}
.scrap{position:absolute;width:78px;height:54px;background-color:#FFFDF6;background-image:repeating-linear-gradient(180deg,transparent 0 10px,#D7E5F6 10px 12px);
  clip-path:polygon(0 8%,30% 0,62% 10%,100% 2%,94% 40%,100% 78%,70% 100%,36% 90%,0 100%,6% 52%)}

/* ---------- Misi 2 ---------- */
.puz{position:absolute;inset:0}
.pslots{position:absolute;overflow:visible;transition:opacity .5s}
.pslots polygon{fill:rgba(255,255,255,.22);stroke:#fff;stroke-width:3;stroke-dasharray:9 8;stroke-linejoin:round}
.puz.done .pslots{opacity:0}
.pc{position:absolute;left:40px;top:290px;width:640px;height:460px;pointer-events:none;filter:drop-shadow(0 6px 5px rgba(0,0,0,.22));will-change:transform}
.pc.drag{filter:drop-shadow(0 18px 14px rgba(0,0,0,.28))}
.pc.locked{filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.pc .in{position:absolute;inset:0;pointer-events:auto;touch-action:none;cursor:grab}
.pc.locked .in{cursor:default}
.paper{position:absolute;left:0;top:0;width:640px;height:460px;border-radius:6px;background-color:#FFFDF6;
  background-image:linear-gradient(90deg,transparent 54px,#F4A3A3 54px,#F4A3A3 57px,transparent 57px),repeating-linear-gradient(180deg,transparent 0 50px,#DCE8F7 50px 52px);
  padding:34px 34px 20px 80px;color:#2E3A5C;text-align:left}
.paper h3{font:700 42px/1.2 var(--f);color:var(--red)}
.paper .ps{font:600 25px/1.42 var(--f);color:#3B4A70;margin:8px 0 16px}
.paper .ps b{color:var(--red);font-weight:700}
.paper ol{list-style:none;display:grid;gap:14px}
.paper li{display:flex;align-items:center;gap:14px;font:600 26px/1.3 var(--f);color:#26315A}
.paper li b{flex:none;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font:700 22px var(--f)}
.tape{position:absolute;width:120px;height:38px;background:rgba(255,226,130,.88);border-radius:4px;z-index:30;transform:rotate(var(--r)) scale(0);transition:transform .45s var(--spring)}
.tape.show{transform:rotate(var(--r)) scale(1)}
.autoBtn,.nextBtn{position:absolute;left:50%;transform:translate(-50%,20px) scale(.9);opacity:0;pointer-events:none;transition:opacity .35s,transform .45s var(--spring)}
.autoBtn{top:202px;display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:12px 28px 12px 16px;font:700 25px var(--f);color:var(--navy);box-shadow:0 6px 0 rgba(0,0,0,.14)}
.autoBtn svg{width:32px;height:32px}
.nextBtn{top:1060px;width:420px;margin:0}
.autoBtn.show,.nextBtn.show{opacity:1;transform:translate(-50%,0)}
#ui .autoBtn:not(.show),#ui .nextBtn:not(.show){pointer-events:none}

/* ---------- Misi 3 ---------- */
.evg{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:26px}
.ev{display:flex;flex-direction:column;align-items:center;gap:12px;background:#F3F6FC;border-radius:28px;padding:14px 14px 20px;box-shadow:0 6px 0 #DCE2EE;transition:transform .14s,box-shadow .14s;text-align:center}
.ev:active{transform:translateY(5px)}
.ev .evi{width:100%;height:200px;border-radius:22px;overflow:hidden;position:relative}
.ev b{font:700 25px/1.2 var(--f);color:var(--navy)}
.ev .evs{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font:700 17px var(--f);color:var(--blue);background:#E0EAFF;padding:7px 14px;border-radius:999px}
.ev .evs svg{width:22px;height:22px}
.ev.done{background:#EAFBF2;box-shadow:0 6px 0 #BDECD3;pointer-events:none}
.ev.done .evs{background:var(--green);color:#fff}
.ev:not(.done){animation:evp 1.6s ease-in-out infinite}
@keyframes evp{0%,100%{box-shadow:0 6px 0 #DCE2EE,0 0 0 0 rgba(30,91,198,0)}50%{box-shadow:0 6px 0 #DCE2EE,0 0 0 9px rgba(30,91,198,.2)}}

/* ---------- Misi 4 ---------- */
.tpill{position:absolute;left:20px;top:124px;display:flex;align-items:center;gap:14px;background:#fff;border-radius:24px;padding:9px 26px 9px 10px;box-shadow:0 6px 0 rgba(0,0,0,.1)}
.tring{position:relative;width:62px;height:62px}
.tring svg{width:62px;height:62px;transform:rotate(-90deg)}
.tring circle{fill:none;stroke-width:7}
.tring .tb{stroke:#EEF1F6}.tring .tf{stroke:var(--green);stroke-linecap:round;stroke-dasharray:163.4}
.tring b{position:absolute;inset:0;display:grid;place-items:center;font:700 27px var(--f)}
.tpill span{font:700 24px var(--f);color:var(--muted)}
.m4counter{position:absolute;left:530px;top:735px;width:200px;height:170px;z-index:6}
.m4counter svg{width:100%;height:100%;display:block}
.dirt{position:absolute;left:296px;top:886px;width:150px;height:28px;border-radius:50%;background:radial-gradient(ellipse,rgba(140,105,70,.55) 0 35%,rgba(140,105,70,.3) 55%,transparent 70%);z-index:3}
.cheer{position:absolute;left:290px;right:30px;top:1040px;height:140px;border-radius:36px;background:#fff;overflow:hidden;
  box-shadow:0 10px 0 #D3D9E4,0 18px 40px rgba(0,0,0,.18);touch-action:manipulation;transition:transform .1s}
.cheer .en{position:absolute;inset:0;background:linear-gradient(90deg,#FFC928,#FF8A2B);transform-origin:left;transform:scaleX(0)}
.cheer .lb{position:relative;display:flex;align-items:center;justify-content:center;gap:16px;height:100%;font:700 38px var(--f);color:var(--ink)}
.cheer .lb svg{width:70px;height:56px}
.cheer .lb small{display:block;font:600 19px var(--f);color:#5d6377}
.cheer.bump{animation:bump .16s}
@keyframes bump{50%{transform:translateY(5px) scale(.97)}}
.shout{position:absolute;background:#fff;color:var(--ink);font:700 26px var(--f);padding:10px 22px;border-radius:999px;white-space:nowrap;box-shadow:0 5px 0 rgba(0,0,0,.08);z-index:8;pointer-events:none}

/* ---------- Ending ---------- */
.endCard{position:absolute;left:40px;right:40px;top:126px;background:#fff;border-radius:38px;padding:34px 36px 34px;text-align:center;box-shadow:0 14px 0 rgba(0,0,0,.1),0 30px 70px rgba(0,0,0,.2)}
.endCard h2{font:700 42px/1.18 var(--f);color:var(--navy);margin:14px 0 4px}
.erows{display:grid;gap:12px;margin-top:20px}
.erows div{display:flex;align-items:center;gap:18px;background:#F3F6FC;border-radius:22px;padding:12px 22px;font:700 28px var(--f);color:var(--navy);text-align:left}
.erows svg{width:50px;height:50px;flex:none}
.again{position:absolute;left:150px;right:150px;top:1092px;width:auto;margin:0}
#wipe .wlogo{position:absolute;left:50%;top:50%;width:300px;height:300px;opacity:0;transform:translate(-50%,-50%) scale(0);filter:drop-shadow(0 12px 0 rgba(0,0,0,.15))}
.photo{position:relative;width:540px;max-width:100%;margin:26px auto 8px;background:#fff;padding:16px 16px 0;border-radius:8px;box-shadow:0 12px 26px rgba(20,30,70,.22),0 0 0 2px #EEF1F6;transform:rotate(-2deg)}
.photo::before{content:'';position:absolute;left:50%;top:-16px;width:130px;height:34px;margin-left:-65px;background:rgba(255,226,130,.9);border-radius:4px;transform:rotate(2deg);z-index:2}
.photo .pimg{position:relative;height:310px;overflow:hidden;border-radius:4px}
.photo .pcap{font:700 30px/1.3 var(--f);color:var(--navy);padding:18px 8px 22px}
.ev .evi.evph{background:#fff;padding:8px 8px 22px;box-shadow:0 4px 10px rgba(20,30,70,.15);border-radius:8px;transform:rotate(-2deg)}
.ev .evi.evph .mini{left:8px;right:8px;top:8px;bottom:22px;border-radius:4px}
.m4counter{left:20px!important}
.ppill{position:absolute;left:250px;top:124px;display:flex;align-items:center;gap:12px;background:#fff;border-radius:24px;padding:9px 24px 9px 14px;box-shadow:0 6px 0 rgba(0,0,0,.1);height:80px}
.ppill svg{width:44px;height:44px}
.ppill span{font:700 22px/1.15 var(--f);color:var(--muted)}
.ppill b{font:700 34px var(--f);color:var(--red);margin-left:4px}
#gateHost{position:absolute;inset:0;z-index:90}
#gateHost[hidden]{display:none!important}
.gbgm{position:absolute;top:12px;right:12px;z-index:95;display:flex;align-items:center;gap:7px;padding:8px 13px 8px 11px;border-radius:999px;
  background:rgba(255,255,255,.9);box-shadow:0 6px 18px -4px rgba(0,0,0,.25);font:800 12px 'Plus Jakarta Sans',system-ui,sans-serif;color:#0c4d46;transition:transform .3s var(--spring),color .3s}
.gbgm[hidden]{display:none}
.gbgm:active{transform:scale(.92)}
.gbgm svg{width:16px;height:16px}
.gbgm .geq{display:flex;gap:2px;align-items:flex-end;height:12px}
.gbgm .geq i{width:3px;height:3px;border-radius:2px;background:#1ea18d;animation:geq 1s ease-in-out infinite}
.gbgm .geq i:nth-child(2){animation-delay:.2s}.gbgm .geq i:nth-child(3){animation-delay:.4s}
@keyframes geq{0%,100%{height:3px}50%{height:12px}}
.gbgm.off{color:#738087}.gbgm.off .geq i{animation:none;background:#b9c1c5}
@media (max-width:360px){.gbgm{padding:8px 10px;gap:5px;top:10px;right:10px}.gbgm #gBgmLbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}
.sCard .wel{font:600 25px var(--f);color:var(--muted);margin-bottom:22px}
.sCard .wel b{display:block;font:700 38px/1.2 var(--f);color:var(--navy);margin-top:4px}
@media (prefers-reduced-motion:reduce){.start .rays{animation:none}}

/* ---------- Jari panduan (tidak menghentikan permainan) ---------- */
#fg{position:absolute;inset:0;z-index:64;pointer-events:none;overflow:hidden}
.fgr{position:absolute;left:0;top:0;width:0;height:0;opacity:0;transition:opacity .3s;will-change:transform}
.fgr.on{opacity:1}
.fgr .rip{position:absolute;left:-46px;top:-46px;width:92px;height:92px;border-radius:50%;border:7px solid #fff;background:rgba(255,255,255,.22);box-shadow:0 0 0 4px rgba(229,50,45,.55),0 8px 16px rgba(0,0,0,.18);opacity:0}
.fgr .hand{position:absolute;left:-41px;top:-6px;width:104px;transform-origin:41px 6px;filter:drop-shadow(0 9px 7px rgba(0,0,0,.3))}
.fgr .hand svg{display:block;width:100%;height:auto;overflow:visible}
.fgr .lbl{position:absolute;left:0;transform:translateX(-50%);top:-92px;white-space:nowrap;background:var(--ink);color:#fff;font:700 25px var(--f);padding:9px 20px;border-radius:999px;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.fgr.tap .hand{animation:fgTap 1.25s ease-in-out infinite}
.fgr.tap .rip{animation:fgRip 1.25s ease-out infinite}
.fgr.tap2 .hand{animation:fgTap2 .62s ease-in-out infinite}
.fgr.tap2 .rip{animation:fgRip .62s ease-out infinite}
.fgr.hold .hand{animation:fgHold 2.4s ease-in-out infinite}
.fgr.hold .rip{animation:fgHoldR 2.4s ease-in-out infinite}
.fgr.rel .hand{animation:fgRel 1.3s ease-in-out infinite}
.fgr.rel .rip{animation:fgRelR 1.3s ease-out infinite}
.fgr.drag .hand{transition:transform .25s;transform:translate(12px,26px)}
.fgr.drag.pr .hand{transform:scale(.88)}
.fgr.drag .rip{transition:opacity .2s,transform .2s;transform:scale(.5)}
.fgr.drag.pr .rip{opacity:1;transform:scale(.62)}
@keyframes fgTap{0%,100%{transform:translate(12px,26px) scale(1)}34%,48%{transform:translate(0,0) scale(.88)}}
@keyframes fgRip{0%,30%{opacity:0;transform:scale(.4)}36%{opacity:1;transform:scale(.55)}100%{opacity:0;transform:scale(1.35)}}
@keyframes fgTap2{0%,100%{transform:translate(8px,18px) scale(1)}40%,55%{transform:translate(0,0) scale(.88)}}
@keyframes fgHold{0%{transform:translate(12px,26px) scale(1)}18%,76%{transform:translate(0,0) scale(.86)}100%{transform:translate(12px,26px) scale(1)}}
@keyframes fgHoldR{0%,14%{opacity:0;transform:scale(.4)}22%,76%{opacity:1;transform:scale(.62)}100%{opacity:0;transform:scale(.9)}}
@keyframes fgRel{0%,35%{transform:translate(0,0) scale(.86)}70%,100%{transform:translate(22px,44px) scale(1)}}
@keyframes fgRelR{0%,35%{opacity:1;transform:scale(.62)}70%,100%{opacity:0;transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){.fgr .hand,.fgr .rip{animation-duration:2.4s}}

/* ---------- Foto: caption gaya stiker ---------- */
.photo .pcap{display:none}
.photo .stk{position:relative;display:flex;align-items:flex-end;margin:-50px -8px 0 -14px;padding-bottom:18px;transform:rotate(1.2deg);z-index:3}
.photo .stkFace{position:relative;flex:none;width:156px;height:156px;border-radius:50%;background:#FFE9A6;border:8px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.12),0 12px 22px rgba(20,30,70,.3);overflow:hidden;transform:rotate(-7deg);z-index:2}
.photo .stkFace .chr{position:relative;width:100%;height:100%}
.photo .stkFace .chr svg{width:100%;height:100%}
.photo .stkTxt{position:relative;flex:1;margin:0 0 22px -4px;background:#FFE15A;color:var(--navy);font:700 29px/1.25 var(--f);text-align:left;padding:16px 22px 16px 30px;border-radius:30px;border:7px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.12),0 12px 22px rgba(20,30,70,.25);transform:rotate(1.6deg)}
.photo .stkTxt b{color:var(--red)}
.photo .stkTxt::before{content:'';position:absolute;left:-19px;bottom:20px;width:24px;height:24px;background:#FFE15A;border-left:7px solid #fff;border-bottom:7px solid #fff;transform:rotate(45deg);border-radius:0 0 0 8px}

/* ---------- Layar transisi: motif + avatar ---------- */
#wipe .wfill{position:absolute;inset:0;opacity:0;pointer-events:none;overflow:hidden;background:radial-gradient(ellipse 75% 58% at 50% 50%,rgba(30,91,198,0) 28%,rgba(8,24,78,.6) 100%)}
#wipe .wfill::before{content:'';position:absolute;inset:0;background-image:var(--wtile);background-size:150px 150px}
#wipe .wrays{position:absolute;left:50%;top:50%;width:1900px;height:1900px;margin:-950px;background:repeating-conic-gradient(rgba(255,255,255,.07) 0 7deg,transparent 7deg 14deg);animation:spin 50s linear infinite}
#wipe .wband{position:absolute;left:0;right:0;height:48px;background:linear-gradient(#E5322D 0 30%,#fff 30% 35%,#0E3A8C 35% 65%,#fff 65% 70%,#FFC928 70%)}
#wipe .wband.top{top:0}#wipe .wband.bot{bottom:0}
#wipe .wheads{position:absolute;inset:0}
#wipe .wfw{position:absolute;top:556px;width:170px;height:170px}
#wipe .wfw.p{left:24px}#wipe .wfw.b{right:24px}
#wipe .wbob{width:100%;height:100%;animation:wbob 1.5s ease-in-out infinite alternate}
#wipe .wfw.b .wbob{animation-delay:-.75s}
@keyframes wbob{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-14px) rotate(3deg)}}
#wipe .wface{width:100%;height:100%;border-radius:50%;border:9px solid #fff;overflow:hidden;box-shadow:0 10px 0 rgba(0,0,0,.2),0 20px 40px rgba(0,0,0,.3)}
#wipe .wfw.p .wface{background:#FFE9A6}#wipe .wfw.b .wface{background:#FFD6D2}
#wipe .wface .chr{position:relative;width:100%;height:100%}
#wipe .wface .chr svg{width:100%;height:100%}
</style>
</head>

<style>
:host{
  --bg:#090819; --ink:#f5f2ff; --muted:#a8a2cc;
  --line:rgba(255,255,255,.12); --glass:rgba(24,21,58,.62);
  --c-connect:#2ee6d6; --c-appr:#ffc24b; --c-resp:#b98cff; --c-emp:#ff7a59;
  --display:'Unbounded', system-ui, sans-serif;
  --body:'Plus Jakarta Sans', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  /* chat */
  --cink:#1e2230; --cink2:#3a3f4e; --cmuted:#7a7e8c; --cline:#e7dfd1; --chatbg:#efe7da; --paper:#fffdf8;
  --arah:#2f6feb; --arah-s:#e6eefe;
  --batas:#e0821b; --batas-s:#fdf0e2;
  --ruang:#1e9e57; --ruang-s:#e3f5ea;
  --k:#8a5bd8; --k-s:#f1eafc;
  --l:#d24b5e; --l-s:#fbe8eb;
  --me:#20434a;
}
*{box-sizing:border-box;margin:0;padding:0}
:host{position:absolute;inset:0;z-index:90;display:block;font-family:var(--body);background:var(--bg);color:var(--ink);overflow:hidden;line-height:normal;text-align:left;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
:host([hidden]){display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit}
[hidden]{display:none!important}

/* ---------- langit ---------- */
.backdrop{position:absolute;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(1100px 600px at 12% -10%, rgba(120,80,255,.30), transparent 60%),
  radial-gradient(900px 500px at 105% 5%, rgba(46,230,214,.16), transparent 60%),
  radial-gradient(1000px 420px at 50% 112%, rgba(255,122,89,.24), transparent 62%),
  linear-gradient(180deg,#0c0a25 0%, #090819 55%, #0e0a1d 100%)}
#sky{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

/* ---------- bar atas (layar gelap) ---------- */
.topbar{position:absolute;left:0;right:0;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 140px 10px 16px;pointer-events:none}
.topbar.hide{opacity:0}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;letter-spacing:.18em;font-size:13px}
.brand .dots{display:grid;grid-template-columns:repeat(2,8px);gap:3px}
.brand .dots i{width:8px;height:8px;border-radius:50%;display:block}
.brand .dots i:nth-child(1){background:var(--c-connect)}.brand .dots i:nth-child(2){background:var(--c-appr)}
.brand .dots i:nth-child(3){background:var(--c-resp)}.brand .dots i:nth-child(4){background:var(--c-emp)}
.pchip{display:none;align-items:center;gap:8px;margin-left:auto;min-width:0;padding:5px 12px 5px 5px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:13px;font-weight:700;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pchip.show{display:flex;animation:gpop .5s ease}
.pchip .av{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:12px;color:#0b0a22;background:linear-gradient(135deg,var(--c-appr),var(--c-connect))}
.pchip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:30vw}
@media (max-width:360px){.topbar{padding-right:78px}}

/* ---------- layar ---------- */
.screen{position:absolute;inset:0;z-index:3;display:none;flex-direction:column;align-items:center;overflow-y:auto;overflow-x:hidden}
.screen.active{display:flex;animation:gscreenIn .6s cubic-bezier(.2,.8,.2,1)}
.copy{font-size:10.5px;letter-spacing:.03em;text-align:center;color:rgba(168,162,204,.8);padding:8px 16px calc(10px + env(safe-area-inset-bottom))}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
h1,h2{font-family:var(--display);font-weight:800;line-height:1.15;letter-spacing:-.01em}
h1{font-size:clamp(26px,6.4vw,40px)} h2{font-size:clamp(20px,4.8vw,28px)}
.lead{color:var(--muted);font-size:15px;line-height:1.6}
.lead b{color:var(--ink)}
.grad{background:linear-gradient(90deg,var(--c-connect),var(--c-appr) 35%,var(--c-resp) 65%,var(--c-emp));-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- 1. NAMA ---------- */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;width:100%;max-width:480px;padding:76px 20px 10px;margin:auto 0}
.emblem{position:relative;width:min(200px,50vw);aspect-ratio:1;margin:16px 0 20px}
.emblem .ring{position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(255,255,255,.2);animation:gspin 36s linear infinite}
.emblem .ring2{position:absolute;inset:14%;border-radius:50%;border:1px solid rgba(255,255,255,.06);box-shadow:0 0 60px rgba(255,194,75,.25) inset}
.orb{position:absolute;width:26%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:clamp(14px,4vw,19px);color:#0b0a22;background:radial-gradient(circle at 35% 30%,#fff 0,var(--c) 42%,var(--cd) 100%);box-shadow:0 0 26px var(--c)}
.orb span{display:block;animation:gspin 36s linear infinite reverse}
.o1{top:-13%;left:37%;--c:var(--c-connect);--cd:#0d8f86}
.o2{right:-13%;top:37%;--c:var(--c-appr);--cd:#b37712;animation:gorbPulse 1.8s ease-in-out infinite}
.o3{bottom:-13%;left:37%;--c:var(--c-resp);--cd:#6a3fc2}
.o4{left:-13%;top:37%;--c:var(--c-emp);--cd:#b23c22}
.core-word{position:absolute;inset:24%;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:clamp(22px,6.4vw,32px);letter-spacing:.06em;background:radial-gradient(circle,rgba(255,255,255,.10),transparent 70%)}
.core-word::before{content:"";position:absolute;inset:-6%;border-radius:50%;border:2px solid rgba(255,255,255,.25);animation:gpulseRing 2.8s ease-out infinite}
.name-form{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:6px;text-align:left}
.name-form label{font-size:13px;font-weight:700;color:var(--muted)}
.sal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sal button{height:46px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-weight:800;font-size:15px;color:var(--muted);transition:all .2s}
.sal button.sel{background:rgba(255,194,75,.16);border-color:var(--c-appr);color:var(--ink)}
.input{width:100%;height:56px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);padding:0 18px;font-size:17px;font-weight:700;outline:none;transition:border-color .2s,box-shadow .2s}
.input::placeholder{color:rgba(168,162,204,.6);font-weight:500}
.input:focus{border-color:var(--c-appr);box-shadow:0 0 0 4px rgba(255,194,75,.18)}
.input.err{border-color:#ff7a7a;animation:gshake .4s}
.hint-err{min-height:18px;font-size:13px;color:#ff9a9a}
.btn-primary{height:56px;border-radius:16px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.06em;color:#0b0a22;background:linear-gradient(90deg,var(--c-appr),#ffe6ad 30%,var(--c-connect) 60%,var(--c-appr));background-size:250% 100%;animation:gshimmer 5s linear infinite;box-shadow:0 10px 30px rgba(255,194,75,.3),inset 0 1px 0 rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s;width:100%}
.btn-primary:active{transform:scale(.97)}

/* ---------- 2. GERBANG ---------- */
#scrGate{justify-content:flex-start}
.gate-wrap{width:100%;display:flex;flex-direction:column;align-items:center;padding:74px 16px 8px;margin:auto 0}
.portal-head{text-align:center;display:flex;flex-direction:column;gap:6px;max-width:620px;margin-bottom:34px;min-height:96px}
.portal-head .lead{min-height:48px;transition:opacity .3s}
.field{position:relative;width:100%;max-width:960px;transition:transform 1.5s cubic-bezier(.6,0,.9,.4)}
.field.zoom{transform:scale(3.4)}
.portals{display:grid;grid-template-columns:repeat(2,1fr);gap:30px 14px;padding-bottom:30px;max-width:420px;margin:0 auto}
@media (min-width:640px){.portals{grid-template-columns:repeat(4,1fr);max-width:920px;gap:20px}}
.pslot{position:relative;display:flex;flex-direction:column;align-items:center;--pw:110px}
@media (min-width:640px){.pslot{--pw:180px}}
.beam{position:absolute;left:50%;bottom:34px;width:70%;height:0;transform:translateX(-50%);background:linear-gradient(to top,var(--glow),transparent);filter:blur(6px);border-radius:50% 50% 0 0;pointer-events:none;opacity:0;transition:height .8s ease,opacity .8s ease;z-index:0}
.pslot.cracked .beam{height:70%;opacity:.8}
.pslot.risen .beam{height:0;opacity:0;transition-duration:1.4s}
.pclip{position:relative;overflow:hidden;padding:44px 24px 0;margin:-44px -24px 0;width:calc(100% + 48px)}
.pslot.settled .pclip{overflow:visible}
.portal{display:block;width:min(var(--pw),100%);margin:0 auto;transform:translateY(112%);transition:transform 1.25s cubic-bezier(.2,.95,.3,1.08);outline:none;position:relative;z-index:1}
.pslot.risen .portal{transform:translateY(0)}
.portal:focus-visible .frame{outline:3px solid #fff;outline-offset:4px}
.frame{position:relative;aspect-ratio:3/4;border-radius:999px 999px 10px 10px;background:
  radial-gradient(circle at 20% 30%,rgba(255,255,255,.07) 0 6%,transparent 7%),
  radial-gradient(circle at 75% 60%,rgba(0,0,0,.18) 0 8%,transparent 9%),
  radial-gradient(circle at 40% 85%,rgba(255,255,255,.05) 0 5%,transparent 6%),
  linear-gradient(160deg,#615d82,#34314f 55%,#1d1b33);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.22),inset 0 -8px 14px rgba(0,0,0,.5),0 12px 30px rgba(0,0,0,.5);transition:box-shadow .8s}
.keystone{position:absolute;top:-8px;left:50%;transform:translateX(-50%);z-index:3;width:34%;aspect-ratio:1.15;display:grid;place-items:center;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:linear-gradient(180deg,#77739a,#3a3757);font-family:var(--display);font-weight:800;font-size:clamp(13px,3.4vw,19px);color:#c9c5e6;transition:background .6s,color .6s}
.gate{position:absolute;inset:11%;inset-block-end:5%;border-radius:999px 999px 6px 6px;overflow:hidden;background:radial-gradient(circle at 50% 60%,#16143a,#07061a 70%);box-shadow:inset 0 0 24px rgba(0,0,0,.95)}
.runes{position:absolute;left:50%;top:52%;width:76%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:1.5px dashed rgba(255,255,255,.12);animation:gspinC 22s linear infinite}
.runes::after{content:"";position:absolute;inset:16%;border-radius:50%;border:1px solid rgba(255,255,255,.07)}
.vortex,.vortex2{position:absolute;inset:-45%;opacity:0;transition:opacity 1.2s ease;background:conic-gradient(from 0deg,var(--c),transparent 22%,var(--c2) 42%,transparent 62%,var(--c) 82%,transparent);filter:blur(8px);animation:gspin 3.6s linear infinite}
.vortex2{animation-duration:6s;animation-direction:reverse;mix-blend-mode:screen;filter:blur(14px)}
.core{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease;background:radial-gradient(circle at 50% 56%,#fff 0,var(--c) 16%,transparent 52%);animation:gbreathe 2.6s ease-in-out infinite}
.lockico{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%) scale(.6);width:38%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;opacity:0;z-index:3;background:radial-gradient(circle,#3b3860,#1f1d38);border:2px solid #77739a;color:#d7d3f2;box-shadow:0 6px 16px rgba(0,0,0,.6);transition:opacity .4s,transform .5s cubic-bezier(.3,1.6,.5,1)}
.lockico svg{width:50%;height:50%}
.chain{position:absolute;inset:0;z-index:2;opacity:0;transition:opacity .4s}
.cbar{position:absolute;left:-15%;top:52%;width:130%;height:9px;margin-top:-4px;display:flex}
.cbar.a{transform:rotate(38deg)}.cbar.b{transform:rotate(-38deg)}
.cbar i{position:relative;flex:1;height:100%;overflow:hidden;background:repeating-linear-gradient(90deg,#9a96b8 0 9px,#4c4970 9px 11px,#7d799e 11px 18px,#2a2845 18px 20px);box-shadow:0 2px 4px rgba(0,0,0,.6);transition:transform 1.1s cubic-bezier(.16,.84,.3,1),opacity 1s ease,filter .5s ease}
.cbar i:first-child{border-radius:4px 0 0 4px}.cbar i:last-child{border-radius:0 4px 4px 0}
.cbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 35%,rgba(255,255,255,.9) 50%,transparent 65%);background-size:300% 100%;background-position:150% 0;opacity:0;transition:opacity .4s}
.vwrap{position:absolute;inset:0;transition:transform 1.6s cubic-bezier(.2,.9,.3,1.08)}
.pslot.locked .vwrap{transform:scale(.25)}
.chargefx{position:absolute;left:50%;top:52%;width:84%;aspect-ratio:1;border-radius:50%;border:2px solid var(--c);box-shadow:0 0 22px var(--glow),inset 0 0 22px var(--glow);transform:translate(-50%,-50%) scale(.5);opacity:0;z-index:1;pointer-events:none;transition:opacity .7s ease,transform 1s cubic-bezier(.2,.8,.2,1)}
.flashfx{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(circle at 50% 54%,#fff 0,var(--c) 28%,transparent 64%);opacity:0}
.frame{transition:box-shadow .8s,filter 1.2s ease}
.pslot.open .vortex,.pslot.open .vortex2,.pslot.open .core{opacity:1}
.pslot.open .runes{border-color:rgba(255,255,255,.45)}
.pslot.open .frame{box-shadow:inset 0 2px 0 rgba(255,255,255,.22),inset 0 -8px 14px rgba(0,0,0,.5),0 0 34px var(--glow),0 0 90px var(--glow)}
.pslot.open .keystone,.pslot.done .keystone{background:linear-gradient(180deg,#fff,var(--c));color:#0b0a22}
.pslot.open .portal{animation:gfloat 3.4s ease-in-out infinite}
.pslot.locked .lockico{opacity:1;transform:translate(-50%,-50%) scale(1)}
.pslot.locked .chain{opacity:1}
.pslot.locked .frame{filter:saturate(.6) brightness(.85)}
.pslot.done .vortex{opacity:.4;animation-duration:9s}
.pslot.done .core{opacity:.35}
.pslot.done .frame{box-shadow:inset 0 2px 0 rgba(255,255,255,.22),inset 0 -8px 14px rgba(0,0,0,.5),0 0 22px var(--glow)}
.portal.wiggle{animation:gwiggle .5s ease}
.pslot.entering .portal{animation:none}

/* --- animasi PASS (tuntas) --- */
.pring{position:absolute;left:50%;top:52%;width:90%;aspect-ratio:1;border-radius:50%;border:2px solid var(--c);box-shadow:0 0 18px var(--glow),inset 0 0 18px var(--glow);transform:translate(-50%,-50%) scale(.2);opacity:0;pointer-events:none;z-index:5}
.pslot.passing .pring{animation:gpring 1.2s ease-out forwards}
.pslot.passing .pring.r2{animation-delay:.28s}
.pslot.passing .beam{animation:gpillar 1.6s ease-out}
.pslot.passing .frame{animation:gflashGlow 1.4s ease-out}
.stamp{position:absolute;left:50%;top:52%;width:42%;aspect-ratio:1;border-radius:50%;z-index:6;display:grid;place-items:center;color:#0b0a22;background:radial-gradient(circle at 35% 30%,#fff 0,var(--c) 55%,var(--c2) 100%);box-shadow:0 0 0 3px rgba(255,255,255,.35),0 0 26px var(--glow);opacity:0;transform:translate(-50%,-50%) scale(0);pointer-events:none}
.stamp svg{width:56%;height:56%}
.pslot.passing .stamp{animation:gstampFly 1.5s cubic-bezier(.3,1.2,.5,1) forwards}
.pslot.passed .stamp{opacity:1;left:84%;top:15%;transform:translate(-50%,-50%) scale(.6)}
.orbit{position:absolute;left:50%;top:50%;width:118%;aspect-ratio:1;border-radius:50%;opacity:0;transition:opacity 1.2s;pointer-events:none;z-index:4;animation:gspinC 7s linear infinite}
.orbit i{position:absolute;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;box-shadow:0 0 8px var(--c),0 0 16px var(--c)}
.orbit i:nth-child(1){left:50%;top:0}.orbit i:nth-child(2){left:100%;top:50%}.orbit i:nth-child(3){left:50%;top:100%}.orbit i:nth-child(4){left:0;top:50%}
.pslot.passed .orbit{opacity:.9}
.pslot.charging .chargefx{opacity:1;transform:translate(-50%,-50%) scale(1);animation:gchargePulse .6s ease-in-out infinite alternate}
.pslot.charging .chain{animation:gtremble .1s linear infinite}
.pslot.charging .cbar i::after{opacity:1;animation:gshine 1.1s ease-in-out infinite}
.pslot.charging .lockico{border-color:var(--c);color:#fff;box-shadow:0 0 0 3px var(--soft),0 0 26px var(--glow)}
.pslot.charging .runes{border-color:var(--c);box-shadow:0 0 16px var(--glow)}
.pslot.unlock .lockico{animation:glockPop .65s cubic-bezier(.5,0,.75,0) forwards}
.pslot.break .chain{animation:none}
.pslot.break .cbar i:first-child{transform:translateX(-75%) rotate(-16deg);opacity:0;filter:blur(1.5px)}
.pslot.break .cbar i:last-child{transform:translateX(75%) rotate(16deg);opacity:0;filter:blur(1.5px)}
.pslot.break .chargefx{animation:none;opacity:0;transform:translate(-50%,-50%) scale(1.9)}
.pslot.break .flashfx{animation:gflashOut 1.1s ease-out forwards}
.portals.allglow .pslot .frame{animation:gallGlow 1.6s ease-in-out 2}
.portals.allglow .pslot .beam{animation:gpillar 1.8s ease-out}

.mound{position:relative;z-index:4;width:min(calc(var(--pw) * 1.3),118%);height:30px;margin-top:-14px}
.mound::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,#34305a 0,#1b1834 55%,rgba(14,12,30,0) 72%)}
.mound svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mound path{fill:none;stroke:var(--c);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:160;stroke-dashoffset:160;filter:drop-shadow(0 0 3px var(--c));transition:stroke-dashoffset 1s ease}
.pslot.cracked .mound path{stroke-dashoffset:0}
.pslot.risen .mound path{opacity:.45;transition:opacity 1.5s ease .6s,stroke-dashoffset 1s}
.plate{margin-top:6px;text-align:center;opacity:0;transform:translateY(8px);transition:opacity .6s ease .5s,transform .6s ease .5s}
.pslot.risen .plate{opacity:1;transform:none}
.plate .pc{font-size:10px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.plate .pn{font-family:var(--display);font-weight:700;font-size:clamp(12px,3.2vw,15px);color:var(--c);margin-top:2px}
.plate .ps{font-size:11px;font-weight:800;color:var(--muted);margin-top:3px;min-height:15px}
.pslot.passed .plate .ps{color:var(--c);animation:gpop .5s ease}
.pslot.locked .plate .pn{color:#8f8ab1}
.tap-hint{position:absolute;left:50%;bottom:-36px;transform:translateX(-50%);z-index:6;white-space:nowrap;padding:6px 12px;border-radius:999px;font-size:11.5px;font-weight:800;color:#0b0a22;background:var(--c);box-shadow:0 6px 20px var(--glow);opacity:0;pointer-events:none;transition:opacity .4s}
.tap-hint::after{content:"";position:absolute;left:50%;top:-5px;width:10px;height:10px;background:var(--c);transform:translateX(-50%) rotate(45deg)}
.pslot.ready .tap-hint{opacity:1;animation:gbob 1.4s ease-in-out infinite}
.dust{position:absolute;bottom:20px;left:50%;width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle,rgba(210,200,240,.9),rgba(140,130,180,0));pointer-events:none;z-index:5;animation:gdust var(--d) ease-out forwards}
.spark{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:90;background:var(--c);box-shadow:0 0 10px var(--c);animation:gspark .9s ease-out forwards}
.star4{position:absolute;width:14px;height:14px;pointer-events:none;z-index:90;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);filter:drop-shadow(0 0 6px var(--c));animation:gspark 1.1s ease-out forwards}
.confetti{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;pointer-events:none;z-index:95;animation:gfall var(--d) linear forwards}
.quake #scrGate .gate-wrap{animation:gquake .1s linear infinite}

.toast{position:absolute;left:50%;top:calc(66px + env(safe-area-inset-top));z-index:110;transform:translate(-50%,-14px);opacity:0;pointer-events:none;padding:10px 16px;border-radius:14px;max-width:calc(100% - 32px);background:#2a2160;border:1px solid rgba(255,255,255,.2);font-size:14px;font-weight:700;box-shadow:0 14px 40px rgba(0,0,0,.5);transition:opacity .3s,transform .3s;text-align:center;color:#fff}
.toast.show{opacity:1;transform:translate(-50%,0)}
#whiteout{position:absolute;inset:0;background:#fff;z-index:105;opacity:0;pointer-events:none;transition:opacity 1s ease}
#whiteout.on{opacity:1;pointer-events:auto}
@keyframes gspin{to{transform:rotate(360deg)}}
@keyframes gspinC{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes gspinSvg{to{transform:rotate(360deg)}}
@keyframes gscreenIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes gpop{0%{transform:scale(.85);opacity:0}60%{transform:scale(1.04);opacity:1}100%{transform:scale(1)}}
@keyframes gpopIn{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes gshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes gwiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-2.5deg)}80%{transform:rotate(2deg)}}
@keyframes gshimmer{to{background-position:-250% 0}}
@keyframes gpulseRing{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.35);opacity:0}}
@keyframes gorbPulse{0%,100%{box-shadow:0 0 18px var(--c)}50%{box-shadow:0 0 40px var(--c),0 0 70px var(--c)}}
@keyframes geq{0%,100%{height:4px}50%{height:16px}}
@keyframes gquake{0%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-1px)}100%{transform:translate(2px,1px)}}
@keyframes gdust{0%{transform:translate(-50%,0) scale(.4);opacity:.9}100%{transform:translate(calc(-50% + var(--dx)),var(--dy)) scale(1.6);opacity:0}}
@keyframes gspark{to{transform:translate(var(--dx),var(--dy)) scale(.2) rotate(180deg);opacity:0}}
@keyframes gfall{to{transform:translate(var(--dx),720px) rotate(var(--r))}}
@keyframes gfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes gfloatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes gbreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes gbob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-5px)}}
@keyframes gpring{0%{opacity:1;transform:translate(-50%,-50%) scale(.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.9)}}
@keyframes gpillar{0%{height:0;opacity:0}30%{height:160%;opacity:1}100%{height:160%;opacity:0}}
@keyframes gflashGlow{0%{filter:brightness(1)}25%{filter:brightness(1.9) saturate(1.3)}100%{filter:brightness(1)}}
@keyframes gstampFly{
  0%{opacity:0;left:50%;top:52%;transform:translate(-50%,-50%) scale(2.6) rotate(-40deg);filter:blur(6px)}
  32%{opacity:1;left:50%;top:52%;transform:translate(-50%,-50%) scale(1) rotate(0);filter:blur(0)}
  62%{opacity:1;left:50%;top:52%;transform:translate(-50%,-50%) scale(1.06)}
  100%{opacity:1;left:84%;top:15%;transform:translate(-50%,-50%) scale(.6)}}
@keyframes gchargePulse{from{box-shadow:0 0 14px var(--glow),inset 0 0 12px var(--glow)}to{box-shadow:0 0 40px var(--glow),inset 0 0 30px var(--glow)}}
@keyframes gtremble{0%{transform:translate(0,0)}25%{transform:translate(-1px,1px)}50%{transform:translate(1px,-1px)}75%{transform:translate(-1px,-1px)}100%{transform:translate(0,0)}}
@keyframes gshine{from{background-position:150% 0}to{background-position:-50% 0}}
@keyframes gflashOut{0%{opacity:0}18%{opacity:1}100%{opacity:0}}

<script>
(()=>{
'use strict';
/* =========================================================
   UTIL
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const lerp=(a,b,k)=>a+(b-a)*k;
const kL=(dt,s)=>1-Math.exp(-dt*s);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const SMOOTH='cubic-bezier(.22,1,.36,1)',SPRING='cubic-bezier(.34,1.56,.64,1)';
function h(tag,cls,html,parent){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const S={gender:'pak',name:''};
const sap=()=>S.gender==='bu'?'Bu':'Pak';
const sapFull=()=>S.gender==='bu'?'Ibu':'Bapak';
function fmt(t){return esc(t.replace(/\{N\}/g,S.name).replace(/\{S\}/g,sap()).replace(/\{B\}/g,sapFull())).replace(/\*\*(.+?)\*\*/g,'<b class="hl">$1</b>');}

/* =========================================================
   STAGE 720x1280, diskalakan ke tinggi 600px
   ========================================================= */
const stage=$('#stage'),sceneEl=$('#scene'),uiEl=$('#ui');
let SCALE=1;
function isTyping(){const a=document.activeElement;return!!a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA');}
const GAME_H=600;let lastAppH=0,frameTries=0;
function sizeApp(){const app=$('#app');if(Math.abs(GAME_H-lastAppH)<2)return;lastAppH=GAME_H;app.style.height=GAME_H+'px';growFrame(GAME_H);}
function growFrame(H){
  try{
    const fe=window.frameElement;if(!fe)return;
    fe.style.height=H+'px';fe.style.minHeight=H+'px';fe.setAttribute('height',H);fe.setAttribute('scrolling','no');
    const P=window.parent;
    if(P&&P.H5P&&P.H5P.instances&&P.H5P.trigger)P.H5P.instances.forEach(i=>{try{P.H5P.trigger(i,'resize');}catch(e){}});
    if(frameTries++<4)setTimeout(()=>{try{if(Math.abs(fe.getBoundingClientRect().height-H)>2){fe.style.height=H+'px';fe.style.minHeight=H+'px';}}catch(e){}},300);
  }catch(e){}
}
function fit(force){
  if(!force&&isTyping())return;
  sizeApp();
  const box=$('#app').getBoundingClientRect(),W=box.width||innerWidth,H=box.height||innerHeight;
  const s=Math.min(W/720,H/1280);SCALE=s;
  document.documentElement.style.setProperty('--minFs',Math.ceil(16.5/s)+'px');
  stage.style.transform=`translate(-50%,-50%) scale(${s})`;
  stage.classList.toggle('framed',(W-720*s>10)||(H-1280*s>10));
}
addEventListener('resize',()=>fit());
if(window.ResizeObserver)new ResizeObserver(()=>fit()).observe($('#app'));
document.addEventListener('focusout',()=>setTimeout(()=>fit(true),350));
fit(true);
function toStage(cx,cy){const r=stage.getBoundingClientRect();return{x:(cx-r.left)/SCALE,y:(cy-r.top)/SCALE};}

/* =========================================================
   JARI PANDUAN: bergerak, tidak menghentikan permainan,
   hilang sendiri begitu pemain melakukannya
   ========================================================= */
const FINGER_SVG=`<svg viewBox="0 0 70 96" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g fill="#2B2D42" stroke="#2B2D42" stroke-width="6" stroke-linejoin="round"><rect x="19" y="4" width="17" height="54" rx="8.5"/><rect x="34" y="31" width="14" height="30" rx="7"/><rect x="46" y="35" width="13" height="28" rx="6.5"/><rect x="57" y="41" width="11" height="24" rx="5.5"/><rect x="16" y="42" width="50" height="40" rx="15"/><rect x="3" y="46" width="17" height="30" rx="8.5" transform="rotate(-24 11 61)"/></g><g fill="#fff"><rect x="19" y="4" width="17" height="54" rx="8.5"/><rect x="34" y="31" width="14" height="30" rx="7"/><rect x="46" y="35" width="13" height="28" rx="6.5"/><rect x="57" y="41" width="11" height="24" rx="5.5"/><rect x="16" y="42" width="50" height="40" rx="15"/><rect x="3" y="46" width="17" height="30" rx="8.5" transform="rotate(-24 11 61)"/></g><g stroke="#D3D9E4" stroke-width="1.8" stroke-linecap="round" fill="none"><path d="M34 42v13M46 45v12M57 50v10"/></g><rect x="21" y="80" width="40" height="14" rx="4" fill="#E5322D" stroke="#2B2D42" stroke-width="3"/><rect x="22.5" y="86" width="37" height="3" fill="#FFC928"/></svg>`;
const FG=h('div','','',stage);FG.id='fg';
const HINT={btn:0,dlg:0};
const hintDelay=(k,a,b)=>HINT[k]++<3?a:b;
const Finger=(()=>{
  const act=new Set();let raf=0;
  const pt=(t,ox,oy,fx,fy)=>{
    if(!t)return null;
    if(typeof t==='function')return t();
    if(t.getBoundingClientRect){
      if(!t.isConnected)return null;
      const r=t.getBoundingClientRect();if(r.width<2&&r.height<2)return null;
      const p=toStage(r.left+r.width*fx,r.top+r.height*fy);return{x:p.x+ox,y:p.y+oy};
    }
    return t;
  };
  function kill(f){
    if(f.dead)return;f.dead=true;act.delete(f);document.removeEventListener('pointerdown',f.w,true);
    f.root.classList.remove('on');f.root.style.opacity=0;
    setTimeout(()=>f.root.remove(),380);
  }
  function tick(now){
    raf=0;
    for(const f of [...act]){
      const s=f.s;
      if(s.el&&!s.el.isConnected){kill(f);continue;}
      if(now<f.t0)continue;
      let p;
      if(s.mode==='drag'){
        const a=pt(s.from,0,0,.5,.5),b=pt(s.to,0,0,.5,.5);
        if(!a||!b){f.root.style.opacity=0;continue;}
        const T=2800,k=((now-f.t0)%T)/T;
        let u=0,press=true,vis=1;
        if(k<.12){vis=k/.12;}
        else if(k<.64){u=(k-.12)/.52;u=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;}
        else if(k<.82){u=1;}
        else{u=1;press=false;vis=1-(k-.82)/.18;}
        p={x:a.x+(b.x-a.x)*u,y:a.y+(b.y-a.y)*u};
        f.root.classList.toggle('pr',press);f.root.style.opacity=vis.toFixed(2);
      }else{
        p=pt(s.el||s.at,s.ox,s.oy,s.fx,s.fy);
        if(!p){f.root.classList.remove('on');continue;}
        if(!f.shown){f.shown=true;}
        f.root.classList.add('on');
      }
      f.root.style.transform='translate('+p.x.toFixed(1)+'px,'+p.y.toFixed(1)+'px)';
    }
    if(act.size)raf=requestAnimationFrame(tick);
  }
  function make(s){
    const f={s,t0:performance.now()+(s.delay||0),dead:false,shown:false};
    f.root=h('div','fgr '+s.mode,`<i class="rip"></i><div class="hand">${FINGER_SVG}</div>${s.label?`<div class="lbl">${esc(s.label)}</div>`:''}`,FG);
    const watch=s.watch||s.el;
    f.w=e=>{if(watch&&watch.contains&&watch.contains(e.target))kill(f);};
    document.addEventListener('pointerdown',f.w,true);
    f.hide=()=>kill(f);
    act.add(f);if(!raf)raf=requestAnimationFrame(tick);
    return f;
  }
  return{
    on(el,o={}){return make(Object.assign({mode:'tap',delay:800,fx:.5,fy:.5,ox:0,oy:0},o,{el}));},
    drag(o={}){return make(Object.assign({mode:'drag',delay:800,fx:.5,fy:.5,ox:0,oy:0},o));},
    clear(){[...act].forEach(kill);}
  };
})();


/* =========================================================
   AUDIO — BGM ringan ala ukulele + glockenspiel (WebAudio)
   ========================================================= */
const AudioSys=(()=>{
  let ctx=null,master,mus,sfx,nb=null,on=true,mood='silence',pending=null,nextT=0,step=0,bar=0,speed=1,lastBlip=0,lastCoin=0;
  try{if(localStorage.getItem('lu2_bgm')==='0')on=false;}catch(e){}
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  function env(g,t,a,v,rel){v=Math.max(v,.0002);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+rel);}
  function osc(type,f,t,a,v,rel,dest,to){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+a+rel);o.connect(g);g.connect(dest);env(g,t,a,v,rel);o.start(t);o.stop(t+a+rel+.05);}
  function noise(t,dur,v,type,freq,dest,q=1,to){if(!nb)return;const s=ctx.createBufferSource();s.buffer=nb;const f=ctx.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(freq,t);if(to)f.frequency.exponentialRampToValueAtTime(to,t+dur);f.Q.value=q;const g=ctx.createGain();s.connect(f);f.connect(g);g.connect(dest);env(g,t,.003,v,dur);s.start(t,Math.random()*1.5);s.stop(t+dur+.05);}
  function pluck(f,t,v,dur){
    const o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),g2=ctx.createGain(),lp=ctx.createBiquadFilter();
    o.type='triangle';o.frequency.value=f;o2.type='sine';o2.frequency.value=f*2;g2.gain.value=.3;
    lp.type='lowpass';lp.frequency.setValueAtTime(Math.min(f*6,5200),t);lp.frequency.exponentialRampToValueAtTime(f*1.6,t+dur);
    o.connect(lp);o2.connect(g2);g2.connect(lp);lp.connect(g);g.connect(mus);env(g,t,.003,v,dur);
    o.start(t);o2.start(t);o.stop(t+dur+.05);o2.stop(t+dur+.05);
  }
  function strum(ns,t,v,up){const a=up?[...ns].reverse():ns;a.forEach((n,i)=>pluck(mtof(n),t+i*.013,v*(up?.65:1),.45));}
  function bell(f,t,v,dest){dest=dest||mus;osc('sine',f,t,.002,v,1.0,dest);osc('sine',f*2.76,t,.002,v*.2,.3,dest);osc('sine',f*5.4,t,.002,v*.06,.15,dest);}
  function bass(f,t,v,rel){osc('sine',f,t,.012,v,rel,mus);osc('triangle',f*2,t,.01,v*.12,rel*.5,mus);}
  const CH=[[48,[60,64,67,72]],[43,[59,62,67,71]],[45,[57,60,64,69]],[41,[57,60,65,69]],[48,[60,64,67,72]],[43,[59,62,67,71]],[41,[57,60,65,69]],[43,[59,62,67,71]]];
  /* melodi "marimba": nada tengah (tidak melengking), memantul riang di atas akor C-G-Am-F */
  const MEL=[[[0,76],[2,79],[4,81],[6,79],[8,76],[12,74]],[[0,74],[2,79],[4,83],[6,79],[8,74],[12,71]],[[0,72],[2,76],[4,81],[6,76],[8,72],[12,76]],[[0,77],[2,81],[4,84],[6,81],[8,77],[12,72]],
             [[0,79],[2,76],[4,79],[6,84],[8,79],[12,76]],[[0,83],[2,79],[4,74],[6,79],[8,83],[12,79]],[[0,81],[2,77],[4,72],[6,77],[8,81],[12,84]],[[0,83],[3,79],[6,74],[8,71],[10,74],[12,79]]];
  const STRUM=[[0,0],[4,0],[6,1],[10,1],[12,0],[14,1]];
  const BASSP={0:0,3:0,6:7,8:0,11:0,14:7};
  const MOODS={
    main:{bpm:106,sv:.042,bv:.15,mv:.07,kick:[0,8],kv:.13,clap:[4,12],cv:.045,shk:1,tr:0},
    party:{bpm:128,sv:.05,bv:.17,mv:.085,kick:[0,4,8,12],kv:.19,clap:[4,12],cv:.07,shk:2,tr:2,stab:1}
  };
  function marimba(f,t,v){osc('sine',f,t,.003,v,.34,mus);osc('sine',f*3.98,t,.002,v*.2,.07,mus);osc('triangle',f*2,t,.003,v*.1,.2,mus);}
  const SNK={bpm:92,ch:[[45,48,52,48],[45,48,52,55],[41,45,48,45],[40,44,47,44]],bells:{1:[[14,76]],3:[[12,80],[14,83]]}};
  function playMain(M,s,t){
    const b=CH[bar%8],T=M.tr||0,ph=bar%16,full=ph<8||ph>=12;
    if(M.stab){
      if(s%4===2)b[1].forEach((n,i)=>pluck(mtof(n+T),t+i*.008,.032,.15));
    }else for(const[st,up]of STRUM)if(st===s)strum(b[1].map(n=>n+T),t,M.sv,up);
    if(s in BASSP)bass(mtof(b[0]+T+BASSP[s]),t,M.bv*(s===0?1:.78),s===0?.38:.2);
    for(const[st,n]of MEL[bar%8])if(st===s){
      if(full){marimba(mtof(n+T),t,M.mv);if(M.stab)bell(mtof(n+T+12),t,M.mv*.3);}
      else if(st===0||st===8)marimba(mtof(n-12+T),t,M.mv*.6);
    }
    if(M.clap.includes(s))noise(t,.08,M.cv,'bandpass',2000,mus,1.4);
    if(M.shk===1&&s%2===0)noise(t,.04,s%4===2?.026:.013,'highpass',7000,mus);
    if(M.shk===2){noise(t,.035,s%4===2?.04:.017,'highpass',7000,mus);if(s%4===2)noise(t,.09,.03,'highpass',6000,mus);}
    if(M.kick.includes(s))osc('sine',150,t,.004,M.kv,.2,mus,48);
  }
  function playSneak(s,t){
    const b=SNK.ch[bar%4];
    if(s%4===0)osc('triangle',mtof(b[s/4]),t,.004,.2,.15,mus);
    if(s%4===2)osc('sine',s%8===2?1700:1300,t,.002,.03,.05,mus);
    const bl=SNK.bells[bar%4];if(bl)for(const[st,n]of bl)if(st===s)bell(mtof(n+12),t,.035);
    if(s===0)osc('sine',mtof(b[0]-12),t,.05,.05,1.2,mus);
  }
  function sched(){
    if(!ctx||ctx.state!=='running')return;
    if(nextT<ctx.currentTime-.25)nextT=ctx.currentTime+.05;
    while(nextT<ctx.currentTime+.12){
      if(pending&&step%4===0){mood=pending;pending=null;step=0;bar=0;}
      const s=step%16;
      if(mood==='sneak')playSneak(s,nextT);else if(MOODS[mood])playMain(MOODS[mood],s,nextT);
      const bpm=(mood==='sneak'?SNK.bpm:(MOODS[mood]?MOODS[mood].bpm:100))*speed;
      nextT+=60/bpm/4;step++;if(step%16===0)bar++;
    }
  }
  function init(){
    if(ctx){if(ctx.resume)ctx.resume();return;}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    try{
      ctx=new AC();
      const comp=ctx.createDynamicsCompressor();comp.connect(ctx.destination);
      master=ctx.createGain();master.gain.value=.9;master.connect(comp);
      mus=ctx.createGain();mus.gain.value=on?.5:0;mus.connect(master);
      sfx=ctx.createGain();sfx.gain.value=.8;sfx.connect(master);
      nb=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      nextT=ctx.currentTime+.1;setInterval(sched,25);
      if(ctx.resume)ctx.resume();
      document.addEventListener('visibilitychange',()=>{if(!ctx)return;if(document.hidden)ctx.suspend();else ctx.resume();});
    }catch(e){ctx=null;}
  }
  const T=(f,dur,o={})=>{if(!ctx)return;osc(o.type||'sine',f,ctx.currentTime+(o.t||0),o.a||.005,o.v??.12,dur,sfx,o.to);};
  const N=(dur,v,type,f,q,t=0,to)=>{if(!ctx)return;noise(ctx.currentTime+t,dur,v,type,f,sfx,q,to);};
  const B=(f,v,t=0)=>{if(!ctx)return;bell(f,ctx.currentTime+t,v,sfx);};
  const SFX={
    pop(){T(480,.12,{to:960,v:.1});},
    tap(){T(820,.05,{v:.05});},
    whoosh(){N(.4,.08,'bandpass',500,1.2,0,3200);},
    alert(){T(988,.12,{type:'triangle',v:.13});T(988,.14,{type:'triangle',v:.13,t:.17});},
    caught(){T(440,.18,{type:'triangle',v:.12,to:350});T(350,.32,{type:'triangle',v:.12,t:.17,to:240});},
    success(){[72,76,79,84].forEach((m,i)=>B(mtof(m+12),.08,i*.08));},
    fanfare(){[60,64,67,72,76,79].forEach((m,i)=>B(mtof(m+12),.08,i*.07));[60,64,67,72].forEach(m=>T(mtof(m),.9,{type:'triangle',v:.035,t:.45}));},
    snap(){T(880,.08,{type:'triangle',v:.12});T(1320,.16,{type:'triangle',v:.1,t:.05});},
    pick(){T(600,.07,{to:850,v:.08});},
    drop(){T(330,.12,{to:200,v:.08,type:'triangle'});},
    drawer(){N(.35,.12,'lowpass',700,1,0,250);T(200,.08,{v:.08,t:.32,type:'triangle'});},
    cheer(){T(rand(520,680),.14,{to:1100,type:'triangle',v:.09});},

const FX=(()=>{
  const cv=$('#fxc');cv.width=720;cv.height=1280;const c=cv.getContext('2d');
  let P=[],run=false,last=0;
  const COLS=['#FFC928','#E5322D','#1E5BC6','#22B573','#FF8FB1','#7FD1FF'];
  function rr(x,y,w,hh,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+hh,r);c.arcTo(x+w,y+hh,x,y+hh,r);c.arcTo(x,y+hh,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
  function draw(p){
    const fade=p.max-p.life<.45?(p.max-p.life)/.45:1;c.globalAlpha=Math.max(0,fade);c.save();c.translate(p.x,p.y);

  function updRes(dt){
    if(!res){spawnT-=dt;if(spawnT<=0)spawn();return;}
    const r=res;r.t+=dt;let bob=0;
    if(r.ph==='in'){r.x+=230*dt;bob=-Math.abs(Math.sin(r.t*9))*10;if(r.x>=r.tx){r.x=r.tx;r.ph='wait';r.t=0;}}
    else if(r.ph==='wait'){if(!quiet&&st==='work'&&giving<=0&&stDur-stT>1.8){giving=1.5;r.ph='take';r.t=0;budi.addPose('leaflet');sayB(r.li.replace('{a}',r.addr));}}
    else if(r.ph==='take'){
      r.aT=(r.t>.35&&r.t<1.35)?-64:-6;
      if(r.t>.9&&!r.got){r.got=true;budi.rmPose('leaflet');r.c.addPose('leafR');r.c.ex('happy');FX.hearts(r.x,560,3);SFX.pop();}
      if(r.t>1.8){r.ph='out';r.t=0;r.c.look(-6);}
    }
    else if(r.ph==='out'){r.x-=230*dt;bob=-Math.abs(Math.sin(r.t*9))*10;if(r.x<-220){r.c.el.remove();delete CAST[r.key];res=null;spawnT=rand(.3,1);return;}}
    r.aC+=(r.aT-r.aC)*kL(dt,10);r.c.arm('R',r.aC);
    r.c.el.style.transform=`translate(${(r.x+150).toFixed(1)}px,${bob.toFixed(1)}px)`;
  }
  M1={budi,me,ui,alertEl,bub,
    get st(){return st;},set quiet(v){quiet=v;},
    setSt(s,d){st=s;stT=0;stDur=d;},
    peekTo(v){peekTarget=v;},
    run:null,
    stop(){alive=false;}
  };
  /* loop dunia: Budi & warga selalu bergerak halus */
  let hooks=null;
  M1.hook=fn=>{hooks=fn;};
  let last=performance.now();
  function frame(now){
    if(!alive)return;
    const dt=Math.min(.05,(now-last)/1000);last=now;
    const paused=hooks&&hooks.paused&&hooks.paused();
    if(!paused){
      t+=dt;stT+=dt;
      if(st==='work'){
        if(giving>0){giving-=dt;aLt=giving>.35?74:14;}else aLt=12+Math.sin(t*2.2)*4;
        aRt=-14+Math.sin(t*2.2+1)*4;
      }else{aLt=10;aRt=-14;}
      if(hooks&&hooks.tick)hooks.tick(dt,stT,stDur,giving);
      updRes(dt);
    }
    aL+=(aLt-aL)*kL(dt,9);aR+=(aRt-aR)*kL(dt,9);budi.arm('L',aL);budi.arm('R',aR);
    const pt=peekTarget!=null?peekTarget:(hooks&&hooks.peeking?hooks.peeking():0);
    peekK+=(pt-peekK)*kL(dt,pt>peekK?9:13);
    M1.peekK=peekK;
    me.el.style.transform=`translate(${lerp(20,-30,peekK).toFixed(1)}px,${lerp(190,-60,peekK).toFixed(1)}px) rotate(${lerp(0,-8,peekK).toFixed(2)}deg)`;
    if(hooks&&hooks.frame)hooks.frame(dt,t);
    if(sayT>0){sayT-=dt;if(sayT<=0)bub.classList.remove('on');}
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
function m1Play(){
  return new Promise(resolve=>{
    const{budi,me,ui,alertEl,bub}=M1;
    const hold=$('.holdBtn',ui),fill=$('.pfill',ui),pct=$('.ptop b',ui),hearts=$$('.hearts svg',ui),vig=$('#vig');
    let prog=0,disp=0,lives=3,down=false,forced=false,paused=false,guided=false,over=false,caughtThis=false,cyc=0,vigK=0,safeToast=false,lastPk=null,exLock=0,peekTime=0;
    let holdF=Finger.on(hold,{mode:'hold',delay:900,fy:.42}),relF=null,relOk=false;
    const hideRel=()=>{if(relF){relF.hide();relF=null;}};
    const press=e=>{if(over||paused)return;if(e){e.preventDefault();if(e.pointerId!=null){try{hold.setPointerCapture(e.pointerId);}catch(_){}}}down=true;forced=false;hold.classList.add('on');if(holdF){holdF.hide();holdF=null;}};
    const release=()=>{down=false;hold.classList.remove('on');if(relF){hideRel();if(M1.st==='alert')relOk=true;}};
    hold.addEventListener('pointerdown',press);
    ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>hold.addEventListener(ev,release));
    hold.addEventListener('contextmenu',e=>e.preventDefault());
    const kd=e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();press();}},ku=e=>{if(e.code==='Space')release();};
    addEventListener('keydown',kd);addEventListener('keyup',ku);
    const detach=()=>{removeEventListener('keydown',kd);removeEventListener('keyup',ku);release();if(holdF){holdF.hide();holdF=null;}hideRel();hold.style.pointerEvents='none';
      hold.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateY(50px) scale(.8)'}],{duration:350,fill:'forwards'});};
    const peeking=()=>down&&!forced&&!paused&&!over;
    function caught(){
      lives--;relOk=false;hideRel();if(hearts[lives])hearts[lives].classList.add('lost');prog=Math.max(0,prog-12);SFX.caught();
      budi.exPop('shock');bub.innerHTML=fmt('Hmm? Kayak ada yang ngintip...');bub.classList.add('on');setTimeout(()=>{if(M1.st!=='alert')bub.classList.remove('on');},1500);
      me.exPop('panic');forced=true;exLock=performance.now()+1400;
      sceneEl.animate([{transform:'translate(0,0)'},{transform:'translate(-10px,4px)'},{transform:'translate(9px,-5px)'},{transform:'translate(-5px,2px)'},{transform:'none'}],{duration:420,easing:'ease-out'});
      if(lives<=0)finish(false);
    }
    async function finish(ok){
      if(over)return;over=true;detach();
      alertEl.classList.remove('on');M1.setSt('work',9999);
      if(ok){
        M1.peekTo(1);budi.look(-7);budi.ex('smile');me.exPop('happy');SFX.success();FX.sparks(560,640,12,'#FFE066');
        await sleep(1100);
      }else{
        await sleep(800);M1.peekTo(1);me.ex('sweatSmile');
        await sleep(400);
      }
      M1.hook({});vig.style.opacity=0;
      resolve(ok);
    }
    M1.hook({
      paused:()=>paused,
      peeking:()=>peeking()?1:0,
      tick(dt,stT,stDur,giving){
        const st=M1.st;
        if(st==='work'){
          if((guided?stT>=stDur:peekTime>=2.8)&&giving<=0){
            M1.setSt('alert',guided?1.8:2.8);alertEl.classList.add('on');bub.classList.remove('on');SFX.alert();
            guided=true;if(!relOk&&down&&!relF)relF=Finger.on(hold,{mode:'rel',delay:0,fy:.42,label:'Lepas tombolnya!'});
          }
        }else if(st==='alert'){
          if(stT>=stDur){hideRel();M1.setSt('look',1.9);alertEl.classList.remove('on');budi.look(10);budi.exPop('think');budi.hop();caughtThis=false;SFX.whoosh();}
        }else if(st==='look'){
          if(stT>.3&&M1.peekK>.45&&!caughtThis){caughtThis=true;caught();}
          if(stT>=stDur&&!over){forced=false;cyc++;M1.setSt('work',rand(Math.max(2.4,3.6-cyc*.2),Math.max(3.2,4.6-cyc*.2)));budi.look(-7);budi.ex('smile');
            if(safeToast){safeToast=false;toast('Aman! Intip lagi saat Budi sibuk.');}}
        }
        if(peeking()&&M1.peekK>.6)peekTime+=dt;
        if(peeking()&&M1.peekK>.6&&M1.st!=='look'){prog=Math.min(100,prog+dt*9.5);if(prog>=100)finish(true);}
      },
      frame(dt,t){
        const pk=peeking();if(!over&&pk!==lastPk&&performance.now()>exLock){lastPk=pk;me.ex(pk?'sly':'nervous');}
        disp+=(prog-disp)*kL(dt,8);fill.style.transform=`scaleX(${(disp/100).toFixed(4)})`;pct.textContent=Math.round(disp)+'%';
        const st=M1.st,vt=over?0:st==='alert'?(.62+.3*Math.sin(t*9)):st==='look'?.95:0;
        vigK+=(vt-vigK)*kL(dt,8);vig.style.opacity=vigK.toFixed(3);
      }
    });
  });
}
