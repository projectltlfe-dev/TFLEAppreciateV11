function buildPuzzle(){
  const W=640,H=460,OX=40,OY=290,keys=['TL','TR','BL','BR'];
  const wrap=h('div','puz','',sceneEl);
  const V=[],Hz=[];
  for(let i=0;i<=8;i++)V.push([W/2+(i===4?0:rand(-14,14)),H*i/8]);
  for(let i=0;i<=10;i++)Hz.push([W*i/10,H/2+(i===5?0:rand(-12,12))]);
  const C=[W/2,H/2];
  const polys={TL:[[0,0],...V.slice(0,5),...Hz.slice(0,5).reverse()],TR:[[W,0],...Hz.slice(5).reverse(),...V.slice(0,4).reverse()],
    BL:[...Hz.slice(0,5),C,...V.slice(5),[0,H]],BR:[C,...Hz.slice(6),[W,H],...V.slice(5).reverse()]};
  wrap.innerHTML=`<svg class="pslots" viewBox="0 0 ${W} ${H}" style="left:${OX}px;top:${OY}px;width:${W}px;height:${H}px">${keys.map(k=>`<polygon points="${polys[k].map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/>`).join('')}</svg>`;
  const qc={TL:[W/4,H/4],TR:[3*W/4,H/4],BL:[W/4,3*H/4],BR:[3*W/4,3*H/4]};
  const loose=shuffle([[190,870],[530,870],[190,1062],[530,1062]]);
  let z=10;
  const pieces=keys.map((k,i)=>{
    const el=h('div','pc',`<div class="in" style="clip-path:polygon(${polys[k].map(p=>p[0].toFixed(1)+'px '+p[1].toFixed(1)+'px').join(',')})">${PAPER}</div>`,wrap);
    el.style.transformOrigin=`${qc[k][0]}px ${qc[k][1]}px`;el.style.zIndex=++z;
    const L=loose[i],lx=L[0]-(OX+qc[k][0]),ly=L[1]-(OY+qc[k][1]),lr=rand(-12,12);
    return{k,el,inn:el.firstChild,qc:qc[k],x:lx,y:ly+520,r:lr*2,s:.72,tx:lx,ty:ly,tr:lr,ts:.72,lock:false,drag:false};
  });
  let alive=true;
  let last=performance.now();
  function loop(now){
    if(!alive)return;const dt=Math.min(.05,(now-last)/1000);last=now;
    for(const p of pieces){
      const k=kL(dt,p.drag?26:12);p.x+=(p.tx-p.x)*k;p.y+=(p.ty-p.y)*k;p.r+=(p.tr-p.r)*kL(dt,10);p.s+=(p.ts-p.s)*kL(dt,14);
      p.el.style.transform=`translate(${p.x.toFixed(2)}px,${p.y.toFixed(2)}px) rotate(${p.r.toFixed(2)}deg) scale(${p.s.toFixed(3)})`;
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  return{W,H,OX,OY,wrap,pieces,bump:()=>++z,stop(){alive=false;}};
}
function puzzlePlay(P){
  return new Promise(resolve=>{
    const{pieces,OX,OY,W,H,wrap}=P;let active=true,done=false;
    const auto=h('button','autoBtn',`${ICON.bolt}<span>Selesaikan Otomatis</span>`,uiEl);
    const next=h('button','btn blue nextBtn','Lanjut',uiEl);
    const autoT=setTimeout(()=>{if(!done)auto.classList.add('show');},10000);
    let hintF=null,hintT=0;
    const stopHint=()=>{clearTimeout(hintT);if(hintF){hintF.hide();hintF=null;}};
    const armHint=ms=>{clearTimeout(hintT);hintT=setTimeout(()=>{if(done||hintF)return;const q=pieces.find(z=>!z.lock);if(!q)return;hintF=Finger.drag({from:()=>({x:OX+q.qc[0]+q.x,y:OY+q.qc[1]+q.y}),to:()=>({x:OX+q.qc[0],y:OY+q.qc[1]}),delay:0});},ms);};
    armHint(2200);
    function snap(p,quiet){
      p.lock=true;p.drag=false;p.tx=0;p.ty=0;p.tr=0;p.ts=1;p.el.classList.add('locked');p.el.classList.remove('drag');p.el.style.zIndex=2;
      if(!quiet)SFX.snap();FX.sparks(OX+p.qc[0],OY+p.qc[1],7,'#FFFFFF');check();if(!done)armHint(7000);
    }
    pieces.forEach(p=>{
      p.inn.addEventListener('pointerdown',e=>{
        if(p.lock||!active)return;e.preventDefault();
        stopHint();p.drag=true;p.el.style.zIndex=P.bump();p.el.classList.add('drag');
        const s=toStage(e.clientX,e.clientY);p.sx=s.x;p.sy=s.y;p.ox=p.tx;p.oy=p.ty;p.tr=0;p.ts=1;
        try{p.inn.setPointerCapture(e.pointerId);}catch(_){}SFX.pick();
      });
      p.inn.addEventListener('pointermove',e=>{
        if(!p.drag)return;const s=toStage(e.clientX,e.clientY);
        const cx=Math.max(60,Math.min(660,OX+p.qc[0]+p.ox+(s.x-p.sx))),cy=Math.max(230,Math.min(1170,OY+p.qc[1]+p.oy+(s.y-p.sy)));
        p.tx=cx-OX-p.qc[0];p.ty=cy-OY-p.qc[1];
      });
      const up=()=>{if(!p.drag)return;p.drag=false;p.el.classList.remove('drag');if(Math.hypot(p.tx,p.ty)<72)snap(p);else{p.tr=rand(-6,6);p.ts=.85;SFX.drop();armHint(6000);}};
      p.inn.addEventListener('pointerup',up);p.inn.addEventListener('pointercancel',up);
    });
    auto.onclick=async()=>{auto.onclick=null;stopHint();auto.classList.remove('show');SFX.tap();
      for(const p of pieces){if(p.lock)continue;p.el.style.zIndex=P.bump();snap(p,true);SFX.snap();await sleep(260);}};
    async function check(){
      if(done||!pieces.every(p=>p.lock))return;done=true;active=false;stopHint();clearTimeout(autoT);auto.classList.remove('show');
      await sleep(500);wrap.classList.add('done');SFX.success();
      [[-10,-6,-38],[W+10,-6,38],[-10,H+6,38],[W+10,H+6,-38]].forEach((tp,i)=>{
        const t=h('div','tape','',wrap);t.style.left=(OX+tp[0]-60)+'px';t.style.top=(OY+tp[1]-19)+'px';t.style.setProperty('--r',tp[2]+'deg');
        setTimeout(()=>t.classList.add('show'),100+i*130);
      });
      instruct('Rencana Budi berhasil disusun!',ICON.checkG,true);
      wrap.animate([{transform:'scale(1)'},{transform:'scale(1.035)'},{transform:'scale(1)'}],{duration:700,delay:500,easing:'ease-in-out'});
      await sleep(900);next.classList.add('show');Finger.on(next,{mode:'tap',delay:900,fx:.7});
      next.onclick=()=>{next.onclick=null;SFX.tap();next.classList.remove('show');resolve();};
    }
  });
}

function m4Play(){
  return new Promise(resolve=>{
    const budi=CAST.budi,me=CAST.me;
    const btn=$('.cheer'),en=$('.cheer .en'),ring=$('.tring .tf'),tnum=$('.tring b'),happyN=$('.ppill b');
    const SPOTS=[340,480,620],LOOKSQ=['rIbu','rPak','rMbak','rMas'],DUR=10;
    const SH=['Semangat, Bud!','Kamu keren!','Mantap, Bud!','Terus, Bud!','Hebat!','Ayo, bisa!'];
    let custs=[],uid=0,lk=0,spawnT=0,energy=0,time=DUR,over=false,alive=true,aPh=0,armR=-30,meArm=-16,pump=0,hopK=0,beep=0,lastShout=0,curEx='smile',served=0;
    budi.addPose('scanner');
    function mk(x){
      const key='cq'+(++uid);
      const c=mkChar(key,nextCust(),{x:820,foot:905,w:196,z:4});c.live(true);c.look(-7);
      const o={c,key,x,tx:x,st:'walk',t:0,ph:rand(0,6),aR:-6,aL:8};c.el.style.transform=`translateX(${(x-820).toFixed(1)}px)`;custs.push(o);return o;
    }
    SPOTS.forEach(x=>mk(x));
    function shout(){
      const n=performance.now();if(n-lastShout<260)return;lastShout=n;
      const d=h('div','shout',pick(SH),uiEl);d.style.left=(250+rand(-10,30))+'px';d.style.top='968px';
      d.animate([{transform:'translate(-20%,16px) scale(.4)',opacity:0},{transform:'translate(-20%,0) scale(1.08)',opacity:1,offset:.18},{transform:'translate(-20%,-4px) scale(1)',opacity:1,offset:.4},{transform:'translate(10%,-48px) scale(.95)',opacity:0}],{duration:1000,easing:SMOOTH}).onfinish=()=>d.remove();
    }
    let cheerF=Finger.on(btn,{mode:'tap2',delay:500,fx:.86,fy:.6}),tapN=0;
    btn.addEventListener('pointerdown',e=>{
      e.preventDefault();if(over)return;if(++tapN>=2&&cheerF){cheerF.hide();cheerF=null;}
      energy=Math.min(1,energy+.12);pump=.18;hopK=1;SFX.cheer();shout();
      btn.classList.remove('bump');void btn.offsetWidth;btn.classList.add('bump');
    });
    let last=performance.now();
    function frame(now){
      if(!alive)return;const dt=Math.min(.05,(now-last)/1000);last=now;
      if(!over){time-=dt;if(time<=0){time=0;finish();}}
      energy=Math.max(0,energy-dt*.3);const m=over?1:1+energy*2.6;AudioSys.setSpeed(over?1:1+energy*.28);
      const queue=custs.filter(o=>o.st!=='exit');
      queue.forEach((o,i)=>{o.tx=SPOTS[Math.min(i,2)];});
      if(queue.length<3){spawnT-=dt*m;if(spawnT<=0){mk(820);spawnT=.55;}}
      let paying=false;
      for(const o of custs){
        o.t+=dt;let bob=0;
        if(o.st==='exit'){
          o.x+=330*m*dt;o.ph+=dt*m*11;bob=-Math.abs(Math.sin(o.ph))*10;
          if(o.x>900){o.dead=true;o.c.el.remove();delete CAST[o.key];continue;}
        }else{
          const d=o.tx-o.x;
          if(Math.abs(d)>2){o.x+=Math.sign(d)*Math.min(Math.abs(d),280*m*dt);o.ph+=dt*m*11;bob=-Math.abs(Math.sin(o.ph))*10;o.st='walk';}
          else{o.x=o.tx;if(o.tx===SPOTS[0]&&queue[0]===o){if(o.st!=='pay'){o.st='pay';o.pay=0;}}else o.st='wait';}
          if(o.st==='pay'){
            paying=true;o.pay+=dt*m;o.aL=lerp(o.aL,48,kL(dt,10));
            if(o.pay>=1.5){
              o.st='exit';o.c.addPose('bag');o.c.ex('happy');o.c.look(7);o.c.el.style.zIndex=7;o.aR=-10;o.aL=8;
              served++;happyN.textContent=served;happyN.animate([{transform:'scale(1.5)'},{transform:'none'}],{duration:300,easing:'ease-out'});
              FX.hearts(o.x,600,4);FX.money(210,760,3+Math.round(energy*3));SFX.coin();
            }
          }else if(o.st!=='exit'){o.aR=-6;o.aL=lerp(o.aL,8,kL(dt,10));}
        }
        o.c.arm('R',o.aR);o.c.arm('L',o.aL);
        o.c.el.style.transform=`translate(${(o.x-820).toFixed(1)}px,${bob.toFixed(1)}px)`;
      }
      custs=custs.filter(o=>!o.dead);
      aPh+=dt*m*7;
      const aT=paying?-55+Math.sin(aPh*1.4)*26:-14+Math.sin(aPh*.4)*4;
      if(paying){beep+=dt*m;if(beep>.45){beep=0;SFX.beep();}}
      armR+=(aT-armR)*kL(dt,14);budi.arm('R',armR);budi.arm('L',10+Math.sin(aPh*.5)*3);
      const want=over?'happy':m>2.6?'sweatSmile':m>1.7?'spark':'smile';if(want!==curEx){curEx=want;budi.ex(want);}
      pump-=dt;meArm+=((pump>0?-158:-16)-meArm)*kL(dt,16);me.arm('R',meArm);
      hopK=Math.max(0,hopK-dt*5);me.el.style.transform=`translateY(${(-Math.sin(hopK*Math.PI)*10).toFixed(2)}px)`;
      en.style.transform=`scaleX(${energy.toFixed(3)})`;ring.style.strokeDashoffset=(163.4*(1-time/DUR)).toFixed(2);tnum.textContent=Math.ceil(time);
      requestAnimationFrame(frame);
    }
    async function finish(){
      over=true;if(cheerF){cheerF.hide();cheerF=null;}btn.style.pointerEvents='none';
      btn.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateY(50px)'}],{duration:350,fill:'forwards'});
      SFX.success();
      await sleep(900);
      resolve(()=>{alive=false;AudioSys.setSpeed(1);});
    }
    requestAnimationFrame(frame);
  });
}

/* =========================================================
   GERBANG CARE (gerbang ke-2: APPRECIATE)
   Dibungkus Shadow DOM agar gayanya tidak bentrok dengan misi.

function runGate(onEnter){
  const GS={nama:'',sapaan:'Pak'};
  const GSound = (() => {
    let ctx = null, master, sfxGain, gSfx, noiseBuf, reverb, storeBus, gateBus, wantOn = true, track = 'gate';
    let sTimer = null, nextT = 0, step = 0, gTimer = null, nextBar = 0, barIdx = 0;
    const BPM = 78, E = 60 / BPM / 2;
    const chords = [[60,64,67,71],[57,60,64,67],[53,57,60,64],[55,59,62,64]];
    const bass = [48,45,41,43], arp = [0,2,1,3,2,1,3,2];
    const f = m => 440 * Math.pow(2, (m - 69) / 12);
    const BAR = 6, G_CHORDS = [[45,52,57,60,64],[41,48,57,60,64],[48,55,60,64,67],[43,50,59,62,67]], PENTA = [69,72,74,76,79,81,84];
    function init(){
      if (ctx) return true;
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
      ctx = new AC();
      const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.connect(ctx.destination);
      master = ctx.createGain(); master.gain.value = .9; master.connect(comp);

      storeBus = ctx.createGain(); storeBus.gain.value = 0; storeBus.connect(lp);
      gateBus = ctx.createGain(); gateBus.gain.value = 0; gateBus.connect(master);
      reverb = ctx.createConvolver(); reverb.buffer = impulse(3.4);
      const rv = ctx.createGain(); rv.gain.value = .6; reverb.connect(rv); rv.connect(gateBus);
      sfxGain = ctx.createGain(); sfxGain.gain.value = .32; sfxGain.connect(master);
      gSfx = ctx.createGain(); gSfx.gain.value = .85; gSfx.connect(master);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      return true;
    }
    function impulse(sec){
      const len = ctx.sampleRate * sec, b = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let c = 0; c < 2; c++){ const d = b.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
      return b;
    }
    /* --- musik toko (lo-fi) --- */
    function tone(freq, t, dur, type, vol, dest, att){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + (att || .01)); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + .05); return o;
    }
    function noise(t, dur, vol, dest, ftype, f0, f1){
      const s = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
      s.buffer = noiseBuf; fl.type = ftype; fl.frequency.setValueAtTime(f0, t); if (f1) fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * .3); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      s.connect(fl); fl.connect(g); g.connect(dest); s.start(t); s.stop(t + dur + .05);
    }
    function sSched(){
      while (nextT < ctx.currentTime + .3){
        const bar = Math.floor(step / 8) % 4, s = step % 8, ch = chords[bar];
        if (s === 0){
          ch.forEach(m => { tone(f(m), nextT, E*8 + .5, 'triangle', .03, storeBus, .7); tone(f(m)*1.004, nextT, E*8 + .5, 'sine', .025, storeBus, .7); });
          tone(f(bass[bar]), nextT, E*3, 'sine', .13, storeBus, .02);
        }
        if (s === 4) tone(f(bass[bar]), nextT, E*3, 'sine', .09, storeBus, .02);
        if (!(s === 7 && bar % 2)) tone(f(ch[arp[s]] + 12), nextT, E*1.8, 'sine', .045, storeBus, .006);
        if (s % 2 === 1) noise(nextT, .05, .016, storeBus, 'highpass', 7000);
        nextT += E; step++;
      }
    }
    /* --- musik gerbang (pad ambient) --- */
    function padNote(m, t, dur){
      const fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = 780; fl.Q.value = .6;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.026, t + 1.8);
      g.gain.setValueAtTime(.026, t + dur - 1.6); g.gain.linearRampToValueAtTime(0, t + dur + .6);

    function setTrack(t){ track = t; apply(); }
    /* --- efek suara gerbang --- */
    function gTone(f0, at, dur, type, vol, f1){
      if (!ctx) return;
      const t = ctx.currentTime + at, o = ctx.createOscillator(); o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t);
      if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);

      else if (name === 'thud'){ gTone(110, 0, .5, 'sine', .42, 38); gNoise(0, .3, 'lowpass', 400, 120, .22); }
      else if (name === 'open'){ gNoise(0, 1.4, 'bandpass', 300, 2600, .2, 1.2, .4); [76, 81, 88].forEach((m, i) => gTone(f(m), .25 + i * .12, 1.4, 'sine', .07)); }
      else if (name === 'lock'){ gTone(560, 0, .09, 'square', .05); gTone(820, .06, .12, 'square', .04); gNoise(0, .12, 'highpass', 3000, null, .08); }
      else if (name === 'pass'){ [1047, 1319, 1568, 2093, 2637].forEach((fr, i) => gTone(fr, i * .08, 1.1, 'sine', .06)); gNoise(0, 1.3, 'highpass', 5000, 9000, .05, 1, .3); }
      else if (name === 'gstamp'){ gTone(150, 0, .4, 'sine', .32, 55); gNoise(0, .16, 'lowpass', 900, 200, .18); }
      else if (name === 'chain'){ for (let i = 0; i < 6; i++) gTone(1700 + Math.random() * 900, i * .05, .12, 'square', .03); gNoise(0, .35, 'highpass', 3000, null, .1); }
      else if (name === 'charge'){ gTone(180, 0, 1.2, 'sine', .1, 760); gTone(270, .1, 1.1, 'triangle', .04, 1140); gNoise(0, 1.2, 'bandpass', 600, 4000, .08, 2, .9); }
      else if (name === 'portal'){ gNoise(0, 1.6, 'bandpass', 180, 6000, .45, 1, .8); gTone(200, 0, 1.5, 'sine', .1, 1400); }
    }
    document.addEventListener('visibilitychange', () => { if (!ctx) return; if (document.hidden) ctx.suspend(); else ctx.resume(); });
    return { begin, setOn, setTrack, sfx, rumble, isOn: () => wantOn };
  })();
  const gBgm=$('#gBgm');
  GSound.setOn(AudioSys.on);gBgm.classList.toggle('off',!AudioSys.on);$('#gBgmLbl').textContent=AudioSys.on?'BGM ON':'BGM OFF';
  gBgm.addEventListener('click',()=>{
    const v=!GSound.isOn();GSound.setOn(v);AudioSys.setOn(v);
    gBgm.classList.toggle('off',!v);$('#bgmBtn').classList.toggle('off',!v);$('#gBgmLbl').textContent=v?'BGM ON':'BGM OFF';
  });
  const gateHost = $('#gateHost');
  const GR = gateHost.attachShadow({ mode:'open' });
  GR.appendChild($('#gateTpl').content.cloneNode(true));
  const G$ = s => GR.querySelector(s), G$$ = s => Array.from(GR.querySelectorAll(s));
  const groot = G$('#groot');
  const wait = sleep;
  const vibrate = p => { try { navigator.vibrate && navigator.vibrate(p); } catch(e){} };
  const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} } };
  const PORTALS = [
    { code:'Video 10', key:'C', name:'Connect',    feel:'Tim merasa dikenal',   c:'#2ee6d6', c2:'#3a8dff', soft:'rgba(46,230,214,.12)',  glow:'rgba(46,230,214,.55)' },
    { code:'Video 11', key:'A', name:'Appreciate', feel:'Tim merasa dihargai',  c:'#ffc24b', c2:'#ff7f2a', soft:'rgba(255,194,75,.12)',  glow:'rgba(255,194,75,.55)' },
    { code:'Video 12', key:'R', name:'Respond',    feel:'Tim merasa didengar',  c:'#b98cff', c2:'#ff5fd2', soft:'rgba(185,140,255,.13)', glow:'rgba(185,140,255,.55)' },
    { code:'Video 13', key:'E', name:'Empower',    feel:'Tim merasa dipercaya', c:'#ff7a59', c2:'#ff3d6e', soft:'rgba(255,122,89,.13)',  glow:'rgba(255,122,89,.6)' }
  ];
  const ACT = 1; /* gerbang yang dibuka di file ini: APPRECIATE */
  function gShow(id){ G$$('.screen').forEach(s => s.classList.toggle('active', s.id === id)); }
  let gToastT;
  function gToast(m){ const t = G$('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(gToastT); gToastT = setTimeout(() => t.classList.remove('show'), 2000); }
  function sparks(x, y, color, n){
    const hr = gateHost.getBoundingClientRect();
    for (let i = 0; i < (n || 14); i++){
      const s = document.createElement('span'); s.className = i % 3 ? 'spark' : 'star4';
      const a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 70;
      s.style.cssText = `left:${x - hr.left - 5}px;top:${y - hr.top - 5}px;--c:${color};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px`;
      groot.appendChild(s); setTimeout(() => s.remove(), 1200);
    }
  }
  const centerOf = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };

  /* langit berbintang */
  const Sky = (() => {
    const cv = G$('#sky'), cx = cv.getContext('2d');
    let W, H, stars = [], motes = [], run = true, raf = 0;
    const cols = PORTALS.map(p => p.c);
    function resize(){
      const d = Math.min(window.devicePixelRatio || 1, 2);
      W = gateHost.clientWidth || innerWidth; H = gateHost.clientHeight || 600; cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0);
      const n = Math.min(220, Math.round(W * H / 5500));
      stars = Array.from({ length:n }, () => ({ x:Math.random() * W, y:Math.random() * H * .9, r:Math.random() * 1.3 + .2, p:Math.random() * 6.3, s:.4 + Math.random() * 1.6 }));
      motes = Array.from({ length:16 }, (_, i) => ({ x:Math.random() * W, y:Math.random() * H, r:1.5 + Math.random() * 2.5, v:.1 + Math.random() * .3, c:cols[i % 4], p:Math.random() * 6.3 }));
    }
    function frame(t){
      if (!run) return;
      cx.clearRect(0, 0, W, H);
      for (const s of stars){ cx.globalAlpha = .25 + .75 * Math.abs(Math.sin(s.p + t * .001 * s.s)); cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 6.283); cx.fill(); }
      for (const m of motes){
        m.y -= m.v; m.x += Math.sin(t * .0006 + m.p) * .25; if (m.y < -10){ m.y = H + 10; m.x = Math.random() * W; }
        cx.globalAlpha = .45; cx.fillStyle = m.c; cx.shadowColor = m.c; cx.shadowBlur = 12; cx.beginPath(); cx.arc(m.x, m.y, m.r, 0, 6.283); cx.fill(); cx.shadowBlur = 0;
      }
      cx.globalAlpha = 1; raf = requestAnimationFrame(frame);
    }
    addEventListener('resize', () => { if (run) resize(); });
    resize(); raf = requestAnimationFrame(frame);
    return { stop(){ run = false; cancelAnimationFrame(raf); } };
  })();

  /* 1. layar nama */
  const nameInput = G$('#nameInput');
  const savedName = store.get('care_player_name'); if (savedName) nameInput.value = savedName;
  const savedSal = store.get('care_player_sal'); if (savedSal === 'Bu' || savedSal === 'Pak') GS.sapaan = savedSal;
  G$$('.sal button').forEach(b => {
    b.classList.toggle('sel', b.dataset.sal === GS.sapaan);
    b.addEventListener('click', () => { GS.sapaan = b.dataset.sal; G$$('.sal button').forEach(x => x.classList.toggle('sel', x === b)); GSound.begin(); GSound.sfx('click'); });
  });
  G$('#nameForm').addEventListener('submit', e => {
    e.preventDefault(); AudioSys.init();
    const v = nameInput.value.trim().replace(/\s+/g, ' ');
    if (v.length < 2){
      G$('#nameErr').textContent = 'Tulis namamu dulu ya (minimal 2 huruf).';
      nameInput.classList.remove('err'); void nameInput.offsetWidth; nameInput.classList.add('err'); vibrate(60); nameInput.focus(); return;
    }
    GS.nama = v.charAt(0).toUpperCase() + v.slice(1);
    store.set('care_player_name', GS.nama); store.set('care_player_sal', GS.sapaan);
    G$('#nameErr').textContent = '';
    GSound.begin(); GSound.setTrack('gate'); GSound.sfx('click');
    G$('#chipName').textContent = GS.nama; G$('#chipAv').textContent = GS.nama.charAt(0).toUpperCase(); G$('#pchip').classList.add('show');
    nameInput.blur();
    buildPortals(); gShow('scrGate'); gateIntro();
  });

  /* 2. gerbang CARE */
  const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const UNLOCK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7.5a4 4 0 0 1 7.6-1.8"/></svg>';
  const LOCK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></svg>';
  let gateReady = false;
  const slotEl = i => GR.querySelector(`.pslot[data-i="${i}"]`);
  const setLead = html => { G$('#gLead').innerHTML = html; };
  function buildPortals(){
    const wrap = G$('#portals'); wrap.innerHTML = '';
    PORTALS.forEach((p, i) => {
      const s = document.createElement('div');
      s.className = 'pslot'; s.dataset.i = i;
      s.style.cssText = `--c:${p.c};--c2:${p.c2};--soft:${p.soft};--glow:${p.glow}`;
      s.innerHTML = `
        <div class="beam"></div>
        <div class="tap-hint">Ketuk untuk masuk</div>${i === ACT ? `<div class="gfinger">${FINGER_SVG}</div>` : ''}
        <div class="pclip">
          <button class="portal" type="button" tabindex="-1" aria-label="${p.code} ${p.name}">
            <div class="frame">
              <div class="keystone">${p.key}</div>
              <div class="gate"><div class="vwrap"><div class="vortex"></div><div class="vortex2"></div><div class="core"></div></div><div class="runes"></div><div class="chargefx"></div><div class="chain"><div class="cbar a"><i></i><i></i></div><div class="cbar b"><i></i><i></i></div></div><div class="lockico">${LOCK_SVG}</div><div class="flashfx"></div></div>
              <i class="pring"></i><i class="pring r2"></i>
              <div class="orbit"><i></i><i></i><i></i><i></i></div>
              <div class="stamp">${CHECK_SVG}</div>
            </div>
          </button>
        </div>
        <div class="mound"><svg viewBox="0 0 120 30" preserveAspectRatio="none" aria-hidden="true"><path d="M60 6 L53 12 L58 16 L45 25 M60 6 L67 11 L62 17 L77 26 M58 16 L34 19 M62 17 L88 20"/></svg></div>
        <div class="plate"><div class="pc">${p.code}</div><div class="pn">${p.name}</div><div class="ps"></div></div>`;
      s.querySelector('.portal').addEventListener('click', () => onPortal(i));
      wrap.appendChild(s);
    });
  }
  function spawnDust(slot, n){
    for (let i = 0; i < n; i++){
      const d = document.createElement('span'); d.className = 'dust';
      d.style.cssText = `--s:${8 + Math.random() * 16}px;--dx:${(Math.random() - .5) * 160}px;--dy:${-20 - Math.random() * 70}px;--d:${.9 + Math.random() * .9}s`;
      slot.appendChild(d); setTimeout(() => d.remove(), 1900);
    }
  }
  async function passPortal(i){
    const s = slotEl(i), p = PORTALS[i];
    s.classList.add('passing'); GSound.sfx('pass'); vibrate(30);
    const [x, y] = centerOf(s.querySelector('.gate')); sparks(x, y, p.c, 18);
    await wait(480); GSound.sfx('gstamp'); vibrate(60);
    await wait(1050);
    s.classList.remove('passing', 'open'); s.classList.add('done', 'passed');
    s.querySelector('.ps').textContent = '✓ Tuntas';
    const [sx, sy] = centerOf(s.querySelector('.stamp')); sparks(sx, sy, p.c, 8);
  }
  async function gateIntro(){
    gateReady = false;
    setLead(`Hai <b>${esc(GS.nama)}</b>, gerbang CARE sedang bangkit…`);
    const slots = G$$('.pslot');
    await wait(500);
    GSound.rumble(3.8); vibrate([200, 80, 250, 80, 300]); groot.classList.add('quake');
    slots.forEach((s, i) => setTimeout(() => { s.classList.add('cracked'); spawnDust(s, 8); }, i * 200));
    await wait(1000);
    slots.forEach((s, i) => setTimeout(() => { s.classList.add('risen'); spawnDust(s, 14); GSound.sfx('thud'); }, i * 320));
    await wait(320 * slots.length + 1100);
    groot.classList.remove('quake');
    slots.forEach(s => { s.classList.add('settled'); s.querySelector('.portal').tabIndex = 0; });
    for (let k = ACT; k < slots.length; k++){ slots[k].classList.add('locked'); slots[k].querySelector('.ps').textContent = 'Tersegel'; }
    GSound.sfx('lock');
    await wait(400);
    /* gerbang 1 CONNECT: sudah tuntas */
    const c = PORTALS[0];
    slots[0].classList.add('open'); GSound.sfx('open');
    setLead(`<b style="color:${c.c}">${c.name}</b> · ${c.feel}`);
    await wait(650);
    await passPortal(0);
    await wait(350);
    setLead('Gerbang pertama tuntas. Saatnya gerbang kedua…');
    await wait(1000);
    /* gerbang 2 APPRECIATE: segel dibuka */
    const e = slots[ACT], P = PORTALS[ACT], [x, y] = centerOf(e.querySelector('.gate'));
    setLead(`Segel <b style="color:${P.c}">APPRECIATE</b> mulai bergetar…`);
    e.classList.add('charging'); GSound.sfx('charge'); vibrate([30, 40, 30, 40, 60]);
    await wait(1200);
    e.querySelector('.lockico').innerHTML = UNLOCK_SVG; GSound.sfx('lock');
    await wait(260);
    e.classList.add('unlock');
    await wait(420);
    e.classList.add('break'); e.classList.remove('charging');
    GSound.sfx('chain'); vibrate([60, 30, 90]); sparks(x, y, '#ffffff', 14);
    await wait(320);
    e.classList.remove('locked'); e.classList.add('open');
    e.querySelector('.ps').textContent = 'Terbuka';
    GSound.sfx('open'); sparks(x, y, P.c, 24);
    await wait(900);
    setLead(`Gerbang <b style="color:${P.c}">APPRECIATE</b> terbuka. Ketuk untuk masuk, ${esc(GS.nama)}!`);
    e.classList.add('ready'); gateReady = true;
  }
  function onPortal(i){
    if (!gateReady) return;
    if (i === ACT){ enterAppreciate(); return; }
    const btn = slotEl(i).querySelector('.portal');
    btn.classList.remove('wiggle'); void btn.offsetWidth; btn.classList.add('wiggle');
    GSound.sfx('click');
    gToast(i < ACT ? `${PORTALS[i].name} sudah tuntas ✓ Lanjut ke Appreciate ya!` : `Gerbang ${PORTALS[i].name} masih tersegel 🔒`);
  }
  async function enterAppreciate(){
    AudioSys.init();
    gateReady = false;
    const s = slotEl(ACT); s.classList.remove('ready'); s.classList.add('entering');
    GSound.sfx('portal'); vibrate(120);
    const field = G$('#field'), fr = field.getBoundingClientRect(), gr = s.querySelector('.gate').getBoundingClientRect();
    field.style.transformOrigin = `${gr.left - fr.left + gr.width / 2}px ${gr.top - fr.top + gr.height / 2}px`;
    field.classList.add('zoom');
    await wait(350); G$('#whiteout').classList.add('on');
    await wait(1300);
    /* masuk ke misi APPRECIATE: Lihat Usahanya! */
    GSound.setTrack('none');
    S.gender=GS.sapaan==='Bu'?'bu':'pak';
    S.name=GS.nama.split(' ').map(x=>x.charAt(0).toUpperCase()+x.slice(1)).join(' ');
    onEnter();
    await wait(250);
    const fadeOut = gateHost.animate([{ opacity:1 }, { opacity:0 }], { duration:1000, easing:'ease', fill:'forwards' });
    gBgm.animate([{ opacity:1 }, { opacity:0 }], { duration:600, fill:'forwards' });
    await fadeOut.finished;
    gateHost.hidden = true; gBgm.hidden = true; fadeOut.cancel(); Sky.stop();
  }
}

/* =========================================================
   ALUR UTAMA
   ========================================================= */
async function main(){
  const run=async fn=>{
    try{return await fn();}
    catch(e){
      console.error('[game]',fn.name,e);
      try{TAP=null;instruct(null);if(DLG){DLG.remove();DLG=null;}uiEl.querySelectorAll('.backdrop,.pwrap,.choices,.toast,.banner').forEach(x=>x.remove());}catch(_){}
    }
  };
  await new Promise(r=>runGate(r));
  await run(startFlow);
  await run(opening);
  await run(mission1);
  await run(drawerScene);
  await run(mission2);
  await run(mission3);
  const stop=await run(mission4);
  await run(()=>ending(stop));
}
main();
})();
</script>
